ext x=\"150\" y=\"330\" font-size=\"34\" font-weight=\"bold\" fill=\"#d62d20\" text-anchor=\"middle\">\u2191 Cl\u207b<\/text><text id=\"clt\" x=\"150\" y=\"372\" font-size=\"18\" text-anchor=\"middle\" fill=\"#111\"><\/text>\n<text x=\"1185\" y=\"330\" font-size=\"18\" text-anchor=\"middle\" fill=\"#111\">105 mEq/L<\/text>\n<text x=\"710\" y=\"540\" font-size=\"20\" fill=\"#2f8f4a\" text-anchor=\"middle\">Anion\u207b<\/text><text x=\"585\" y=\"330\" font-size=\"20\" fill=\"#2f8f4a\" text-anchor=\"middle\">Cl\u207b 105 mEq/L<\/text>\n<g id=\"dyn\"><\/g><g id=\"ptc\"><\/g><text id=\"fl\" x=\"160\" y=\"121\" font-size=\"15\" fill=\"#33404c\" dominant-baseline=\"central\">Fluid flow \u2193<\/text><g id=\"fx\"><\/g><\/svg>\n<div id=\"bar2\" style=\"margin:10px 0 0\"><span>Drugs and disease:<\/span><\/div>\n<div id=\"info\"><\/div><\/div>\n<script>\nconst $=s=>document.querySelector(s);\nconst TK={Na:['Na\u207a','#8d8a1b'],K:['K\u207a','#d62d20'],Cl:['Cl\u207b','#2e7d4f'],H:['H\u207a','#2b4fd6'],F:['Formate\u207b','#8a4fa8'],Glu:['Glucose','#2a8fa0'],Ca:['Ca\u00b2\u207a, Mg\u00b2\u207a','#7a5a3a']};\nconst SH={Na:'Na\u207a',K:'K\u207a',Cl:'Cl\u207b',H:'H\u207a',F:'Formate\u207b',Glu:'Glc',Ca:'Ca\u00b2\u207a/Mg\u00b2\u207a'};\nconst INFO={Na:'<b>Na\u207a<\/b> enters the cell by the Na\u207a/H\u207a exchanger (NHE) and, in the last segment, by SGLT1 with glucose. The Na\u207a\u2013K\u207a ATPase on the blood side pumps it out and keeps intracellular Na\u207a low. Na\u207a also crosses the tight junction between cells (the dashed line), pulled by the lumen-positive potential.',\nK:'<b>K\u207a<\/b> is taken into the cell from the blood by the Na\u207a\u2013K\u207a ATPase (3 Na\u207a out, 2 K\u207a in), which uses ATP and powers the coupled transport on the lumen side.',\nCl:'<b>Cl\u207b<\/b> rises to about 140 mEq/L in the lumen because water and HCO\u2083\u207b were reabsorbed earlier and Cl\u207b was left behind. It enters through the Cl\u207b/formate\u207b exchanger, leaves the cell to the blood (cell Cl\u207b about 105), and also diffuses through the tight junction down its gradient. That diffusion makes the lumen slightly positive (+4 mV).',\nH:'<b>H\u207a<\/b> is secreted into the lumen by NHE in exchange for Na\u207a. In the lumen it can combine with formate\u207b to form formic acid, which diffuses back into the cell and releases H\u207a and formate\u207b again, so the cycle keeps NHE and the Cl\u207b exchanger working.',\nF:'<b>Formate\u207b<\/b> is made inside the cell by one-carbon metabolism: amino acids such as serine and glycine feed formate\u207b into the cell pool (purple box). The Cl\u207b/formate\u207b exchanger secretes it into the lumen. There it picks up H\u207a from NHE and becomes neutral formic acid (HCOOH), which diffuses back into the cell (dashed arrow) and splits again into H\u207a and formate\u207b. This recycling links Na\u207a uptake and Cl\u207b uptake.',\nGlu:'<b>Glucose<\/b> is taken up in the last segment by SGLT1 with Na\u207a. SGLT1 has low capacity and high affinity: it mops up the small amount of glucose that the early segment (SGLT2) missed.',\nCa:'<b>Ca\u00b2\u207a and Mg\u00b2\u207a<\/b> are reabsorbed mainly between the cells, through the tight junction (dashed arrow), not through the cell. In the late proximal tubule the lumen-positive potential and the rising luminal concentration after water reabsorption drive this passive movement.',\nDX:'<b>Diamox (acetazolamide)<\/b> blocks carbonic anhydrase, so less H\u207a is made for NHE. Na\u207a/H\u207a exchange and formate recycling fall, so less Na\u207a and Cl\u207b are taken up through the transporters.',\nSGI:'<b>SGLT inhibitors<\/b> (gliflozins) block the Na\u207a\u2013glucose cotransporter. Here SGLT1 stops taking up glucose and its share of Na\u207a, so glucose that reaches the late segment passes into the urine (glucosuria) with a little osmotic diuresis. NHE, the Cl\u207b exchanger and the tight-junction route are unaffected. Selective SGLT2 inhibitors act mainly in the early segment; blocking SGLT1 as well (for example sotagliflozin) removes this last-chance uptake too.',\nFAN:'<b>Fanconi syndrome<\/b> is a generalized failure of proximal reabsorption. Na\u207a-coupled transport falls across the board, so glucose, amino acids, phosphate and bicarbonate are lost in the urine, causing proximal (type 2) renal tubular acidosis.'};\nconst DEF='Select solutes to follow their routes; others fade. Turn on Moving solutes to watch Na\u207a (olive), Cl\u207b (green) and glucose (teal) drift down the lumen and cross by the transporters or between cells. Try the drugs.';\nconst SP=[['s0','#f4d8db','#d58f98'],['s1','#e2f2f4','#5fb0bd'],['s2','#dcd6ef','#8f84bb'],['s3','#e4f3de','#8fc486'],['s4','#f7e3c6','#d9a468']];\n$('#defs').insertAdjacentHTML('beforeend',SP.map(([i,a,b])=>`<radialGradient id=\"${i}\" cx=\".35\" cy=\".3\" r=\".85\"><stop offset=\"0\" stop-color=\"#fff\"/><stop offset=\".3\" stop-color=\"${a}\"/><stop offset=\"1\" stop-color=\"${b}\"/><\/radialGradient>`).join(''));\nconst arrow=(x1,y,x2)=>`<line x1=\"${x1}\" y1=\"${y}\" x2=\"${x2}\" y2=\"${y}\" stroke=\"#111\" stroke-width=\"2.4\" marker-end=\"url(#ah)\"/>`;\nconst txt=(t,x,y,s=20)=>`<text x=\"${x}\" y=\"${y}\" font-size=\"${s}\" fill=\"#111\" dominant-baseline=\"central\">${t}<\/text>`;\nconst el=(k,i)=>`<g class=\"el\" data-k=\"${k}\">${i}<\/g>`;\nconst lab=(t,c='#1d2a1d')=>t?`<text y=\"1\" font-size=\"17\" font-weight=\"bold\" fill=\"${c}\" text-anchor=\"middle\" dominant-baseline=\"central\" pointer-events=\"none\">${t}<\/text>`:'';\nconst tp=(k,x,y,f,n,l,c)=>`<g class=\"el tp\" data-k=\"${k}\" data-x=\"${x}\" data-y=\"${y}\" transform=\"translate(${x},${y})\"><title>${n}<\/title><circle r=\"34\" fill=\"url(#${f})\" stroke=\"#555\" stroke-opacity=\".5\" stroke-width=\"2\"/>${lab(l,c)}<\/g>`;\nlet h='';\nh+=el('Na',arrow(225,236,355)+txt('Na\u207a',366,236))+el('H',arrow(355,288,225)+txt('H\u207a',366,288));\nh+=el('Cl',arrow(225,424,355)+txt('Cl\u207b',366,424))+el('F',arrow(355,476,225)+txt('Formate\u207b',366,476));\nh+=el('Na',arrow(225,699,355)+txt('Na\u207a',366,699))+el('Glu',arrow(225,751,355)+txt('Glucose',366,751));\nh+=el('Na',arrow(815,189,945)+txt('Na\u207a',957,189))+el('K',arrow(945,241,815)+txt('K\u207a',957,241));\nh+=el('Cl',arrow(815,450,945)+txt('Cl\u207b',957,450));\nh+=el('Na Cl',`<path d=\"M200 600 L1090 600\" stroke=\"#111\" stroke-width=\"2.4\" stroke-dasharray=\"8 6\" fill=\"none\" marker-end=\"url(#ah)\"/><text x=\"48\" y=\"600\" font-size=\"22\" font-weight=\"bold\" fill=\"#111\" dominant-baseline=\"central\">Na\u207a, Cl\u207b<\/text>`);\nh+=el('F H',`<line x1=\"225\" y1=\"520\" x2=\"355\" y2=\"520\" stroke=\"#111\" stroke-width=\"2.4\" stroke-dasharray=\"7 5\" marker-end=\"url(#ah)\"/>`+txt('HCOOH \u2192 H\u207a + formate\u207b',366,520,16));\nh+=el('F',`<rect x=\"545\" y=\"440\" width=\"240\" height=\"56\" rx=\"8\" fill=\"#efe3f5\" stroke=\"#8a4fa8\" stroke-width=\"2\"/><text x=\"665\" y=\"462\" font-size=\"14\" font-weight=\"bold\" fill=\"#5a2d72\" text-anchor=\"middle\">Formate\u207b made in the cell<\/text><text x=\"665\" y=\"482\" font-size=\"13\" fill=\"#5a2d72\" text-anchor=\"middle\">amino acids \u2192 one-carbon units<\/text><line x1=\"545\" y1=\"470\" x2=\"488\" y2=\"470\" stroke=\"#111\" stroke-width=\"2.4\" marker-end=\"url(#ah)\"/>`);\nh+=el('Ca',`<rect x=\"48\" y=\"520\" width=\"92\" height=\"56\" fill=\"#fff6d8\" stroke=\"#a8956a\" stroke-width=\"2\"/><text x=\"94\" y=\"542\" font-size=\"17\" text-anchor=\"middle\" fill=\"#111\">Ca\u00b2\u207a<\/text><text x=\"94\" y=\"564\" font-size=\"17\" text-anchor=\"middle\" fill=\"#111\">Mg\u00b2\u207a<\/text><path d=\"M142 548 L428 580 L1090 580\" fill=\"none\" stroke=\"#5a5f9a\" stroke-width=\"2.4\" stroke-dasharray=\"8 6\" marker-end=\"url(#ah)\"/>`);\nh+=el('Glu','<rect x=\"570\" y=\"685\" width=\"170\" height=\"64\" fill=\"#f4f6fa\" stroke=\"#9aa\" /><text x=\"655\" y=\"707\" font-size=\"17\" text-anchor=\"middle\" fill=\"#111\">Low capacity<\/text><text x=\"655\" y=\"730\" font-size=\"17\" text-anchor=\"middle\" fill=\"#111\">High affinity<\/text>');\nh+=tp('Na H',290,262,'s0','Na\u207a/H\u207a exchanger','NHE')+tp('Cl F',290,450,'s1','Cl\u207b/formate\u207b exchanger (CFEX)','CFEX')+tp('Na Glu',290,725,'s2','Na\u207a\u2013glucose cotransporter','SGLT1');\nh+=tp('Na K',880,215,'s3','Na\u207a\u2013K\u207a ATPase','ATP','#2a4a9a')+tp('Cl',880,450,'s1','Cl\u207b exit (KCl cotransport)','');\nconst FL=[['Na',150,236,430],['H',430,288,150],['Cl',150,424,430],['F',430,476,150],['Na',150,699,430],['Glu',150,751,430],['Na',780,189,1060],['K',1060,241,780],['Cl',780,450,1060],['Na',150,600,1060,0],['Cl',150,600,1060,.25],['F',545,470,490],['Ca',150,580,1060]];\nFL.forEach((f,i)=>{[0,.5].forEach(p=>{const l=SH[f[0]],w=Math.max(42,l.length*10+18);h+=`<g class=\"tk\" data-f=\"${i}\" data-p=\"${p+(f[4]||0)}\" style=\"display:none\"><rect x=\"${-w/2}\" y=\"-13\" width=\"${w}\" height=\"26\" rx=\"13\" fill=\"${TK[f[0]][1]}\"/><text font-size=\"15\" font-weight=\"bold\" fill=\"#fff\" text-anchor=\"middle\" dominant-baseline=\"central\">${l}<\/text><\/g>`})});\n$('#dyn').innerHTML=h;\nconst X=(x,y)=>`<line x1=\"${x-16}\" y1=\"${y-16}\" x2=\"${x+16}\" y2=\"${y+16}\" stroke=\"#c0281f\" stroke-width=\"5\"/><line x1=\"${x+16}\" y1=\"${y-16}\" x2=\"${x-16}\" y2=\"${y+16}\" stroke=\"#c0281f\" stroke-width=\"5\"/>`;\nconst NT=(t,x,y)=>`<text x=\"${x}\" y=\"${y}\" font-size=\"15\" font-weight=\"bold\" fill=\"#c0281f\" dominant-baseline=\"central\">${t}<\/text>`;\n$('#fx').innerHTML=`<g class=\"fx\" data-k=\"DX\" style=\"display:none\">${X(290,262)}${X(290,450)}${NT('Less H\u207a for NHE and formate recycling',40,175)}<\/g><g class=\"fx\" data-k=\"SGI\" style=\"display:none\">${X(290,725)}${NT('SGLT blocked: glucose lost in urine',40,175)}<\/g><g class=\"fx\" data-k=\"FAN\" style=\"display:none\">${X(290,262)}${X(290,450)}${X(290,725)}${NT('Transporter reabsorption fails',40,175)}<\/g>`;\nconst act=new Set();let last=null;const bar=$('#bar');\nconst FX={DX:['Diamox (acetazolamide)','#a0302a'],SGI:['SGLT inhibitor','#5a6b7d'],FAN:['Fanconi syndrome','#7a3b8c']};\nconst mk=(par,k,name,col)=>{const b=document.createElement('button');b.className='sb';b.dataset.k=k;b.style.setProperty('--c',col);b.textContent=name;b.onclick=()=>{if(act.has(k))act.delete(k);else{act.add(k);last=k}if(!act.has(last))last=[...act].pop()||null;upd()};par.appendChild(b)};\nObject.keys(TK).forEach(k=>mk(bar,k,TK[k][0],TK[k][1]));\n['Na','Cl','Glu'].forEach(k=>bar.querySelector(`[data-k=\"${k}\"]`).classList.add('dot'));\nObject.keys(FX).forEach(k=>mk($('#bar2'),k,FX[k][0],FX[k][1]));\n[['All',()=>{Object.keys(TK).forEach(k=>act.add(k));last='Na'}],['Clear',()=>{act.clear();last=null}]].forEach(([n,f])=>{const b=document.createElement('button');b.className='sb g';b.textContent=n;b.onclick=()=>{f();upd()};bar.appendChild(b)});\nlet CL=140;\nfunction upd(){const mv=(4*(CL-105)/35).toFixed(1).replace('.0','');$('#mv').textContent=(mv>0?'+':'')+mv+' mV';$('#clt').textContent=CL+' mEq/L';\nconst any=[...act].some(k=>TK[k]);document.querySelectorAll('.fx').forEach(e=>{e.style.display=act.has(e.dataset.k)?'':'none'});\ndocument.querySelectorAll('.el').forEach(e=>{const m=e.dataset.k.split(' ').some(k=>act.has(k));e.setAttribute('opacity',any&&!m?.28:1)});\ndocument.querySelectorAll('.sb[data-k]').forEach(b=>b.classList.toggle('on',act.has(b.dataset.k)));\n$('#info').innerHTML=last?INFO[last]+(act.size>1?`<br><span style=\"font-size:13px;opacity:.75\">Showing ${act.size} items; the text describes the one you picked last.<\/span>`:''):DEF}\nconst PC={Na:'#8d8a1b',Cl:'#2e7d4f',Glu:'#2a8fa0'},PN={Na:'Na\u207a',Cl:'Cl\u207b',Glu:'Glucose'},PG=$('#ptc'),PT=[];\nconst LY={nhe:236,pa:600,sg:699,ex:424,gl:751};\nconst RTE={nhe:[[290,236],[800,236],[800,189],[945,189],[1150,189]],sg:[[290,699],[850,699],[1150,699]],pa:[[290,600],[1150,600]],ex:[[290,424],[800,450],[1150,450]],gl:[[290,751],[850,751],[1150,751]]};\nfunction prob(p){const r=p.rt;if(r==='pa')return .4+.55*(CL-105)/55;let b={nhe:.85,sg:.9,ex:.85,gl:1}[r];\nif(act.has('FAN'))b=.08;if(act.has('DX')){if(r==='nhe')b*=.3;if(r==='ex')b*=.4}\nif(act.has('SGI')){if(r==='sg')b=.05;if(r==='gl')b=.03}return b}\nfunction mkP(pre){const u=Math.random(),kind=u<.45?'Na':u<.8?'Cl':'Glu',v=Math.random();\nconst rt=kind==='Glu'?'gl':kind==='Na'?(v<.3?'pa':v<.75?'nhe':'sg'):(v<.45?'pa':'ex'),ly=LY[rt];\nconst g=document.createElementNS('http://www.w3.org/2000/svg','g');g.innerHTML=`<title>${PN[kind]}<\/title><circle r=\"10\" fill=\"${PC[kind]}\" stroke=\"#fff\" stroke-width=\"2\"/>`;PG.appendChild(g);\nPT.push({kind,rt,ly,x:50+Math.random()*210,y:pre?140+Math.random()*Math.max(10,ly-220):140,vy:36+Math.random()*14,ph:Math.random()*6.3,st:'drift',a:pre?1:0,fade:1,g})}\nlet showP=false;\nfunction stepP(t,dt){PG.style.display=showP?'':'none';$('#fl').style.display=showP?'':'none';if(!showP)return;\nif(PT.length<56&&t-(stepP.s||0)>.5){stepP.s=t;mkP(0)}\nconst any=Object.keys(TK).some(k=>act.has(k));\nfor(let i=PT.length-1;i>=0;i--){const p=PT[i];p.a=Math.min(1,p.a+dt*2);\nif(p.st==='drift'){p.y+=p.vy*dt;p.x=Math.min(262,Math.max(48,p.x+Math.sin(t*1.7+p.ph)*12*dt));if(!p.passed&&p.y>=p.ly-70)p.st='appr';p.fade=Math.max(0,Math.min(1,(772-p.y)/40))}\nelse if(p.st==='appr'){const dx=252-p.x,dy=p.ly-p.y,d=Math.hypot(dx,dy);if(d<4){if(Math.random()<prob(p)){p.wp=RTE[p.rt].map(a=>a.slice());p.st='path'}else{p.passed=true;p.st='drift'}}else{const s=Math.min(d,95*dt);p.x+=dx/d*s;p.y+=dy/d*s}}\nelse if(p.st==='path'){const w=p.wp[0],dx=w[0]-p.x,dy=w[1]-p.y,d=Math.hypot(dx,dy),s=150*dt;if(d<=s){p.x=w[0];p.y=w[1];p.wp.shift();if(!p.wp.length)p.st='cap'}else{p.x+=dx/d*s;p.y+=dy/d*s}}\nelse{p.y+=40*dt;p.fade-=dt*.9}\nif((p.st==='drift'&&p.y>775)||p.fade<=0){p.g.remove();PT.splice(i,1);continue}\nconst on=act.has(p.kind);p.g.setAttribute('opacity',(p.a*p.fade*(any&&!on?.28:1)).toFixed(2));\np.g.setAttribute('transform',`translate(${p.x.toFixed(1)},${p.y.toFixed(1)}) scale(${on?1.3:1})`)}}\n{const b=document.createElement('button');b.className='sb g';b.textContent='Moving solutes';b.onclick=()=>{showP=!showP;b.classList.toggle('on',showP);bar.classList.toggle('pon',showP)};bar.appendChild(b)}\nfor(let i=0;i<22;i++)mkP(1);\nconst tps=[...document.querySelectorAll('.tp')],tks=[...document.querySelectorAll('.tk')];\nlet pt=0;function loop(ts){const t=ts/1000,dt=Math.min(.05,t-(pt||t));pt=t;stepP(t,dt);\ntks.forEach(k=>{const f=FL[k.dataset.f],on=act.has(f[0]);k.style.display=on?'':'none';if(on){const u=(t/2.6+ +k.dataset.p)%1;k.setAttribute('transform',`translate(${f[1]+(f[3]-f[1])*u},${f[2]})`);k.setAttribute('opacity',Math.sin(Math.PI*u).toFixed(2))}});\ntps.forEach(p=>{const on=p.dataset.k.split(' ').some(k=>act.has(k)),s=on?1+.09*Math.sin(t*4):1;p.setAttribute('transform',`translate(${p.dataset.x},${p.dataset.y}) scale(${s.toFixed(3)})`)});\nrequestAnimationFrame(loop)}\nupd();requestAnimationFrame(loop);\n<\/script><\/body><\/html>\n", "<!DOCTYPE html><html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Thin Descending Limb \u2014 Interactive Transport<\/title><style>:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#c9d4c8;font-family:Verdana,Arial,sans-serif;color:#203021}#wrap{max-width:1200px;margin:auto;padding:14px}h1{text-align:center;font-size:23px;margin:8px 0 14px}.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 12px}.bar>span{font-size:13px;color:#485a49}.btn{border:2px solid var(--c,#647561);background:#ffffff66;border-radius:24px;padding:7px 13px;font:14px Verdana;cursor:pointer;color:#253126;transition:background .3s,color .3s,transform .2s}.btn:hover{transform:translateY(-1px)}.btn.on{background:var(--c,#647561);color:white}svg{width:100%;height:auto;display:block}.panel{background:#bcc7b8;border-radius:11px;padding:13px 16px;line-height:1.5;min-height:85px;font-size:15px}.legend{font-size:13px;display:flex;gap:18px;flex-wrap:wrap;margin:8px 0}.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:5px}.note{font-size:12px;color:#4d5a4c;margin-top:8px}.transport{transition:opacity .5s}.aqua{transition:opacity .6s}#aqpLabel{transition:opacity .5s}<\/style><\/head><body><div id=\"wrap\"><h1>THIN DESCENDING LIMB OF THE LOOP OF HENLE<\/h1><div class=\"bar\" id=\"controls\"><span>Conditions:<\/span><button class=\"btn on\" data-mode=\"normal\" style=\"--c:#667b63\">Normal<\/button><button class=\"btn\" data-mode=\"dehydration\" style=\"--c:#b66b32\">Dehydration<\/button><button class=\"btn\" data-mode=\"overhydration\" style=\"--c:#3682b3\">Overhydration<\/button><button class=\"btn\" data-mode=\"block\" style=\"--c:#9b3f52\">Reduced AQP1 function<\/button><\/div><div class=\"bar\"><span>Show:<\/span><button class=\"btn on\" id=\"water\" style=\"--c:#277dba\">Moving water<\/button><button class=\"btn on\" id=\"solute\" style=\"--c:#987e24\">Luminal solutes<\/button><button class=\"btn on\" id=\"labels\" style=\"--c:#68746c\">Transport labels<\/button><button class=\"btn\" id=\"pause\" style=\"--c:#68746c\">Pause<\/button><\/div><svg id=\"fig\" viewBox=\"0 0 1300 800\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"cell\" x1=\"0\" x2=\"1\"><stop stop-color=\"#dae7f0\"/><stop offset=\".5\" stop-color=\"#f2f6fa\"/><stop offset=\"1\" stop-color=\"#cbdbe8\"/><\/linearGradient><linearGradient id=\"med\" x1=\"0\" x2=\"0\" y1=\"0\" y2=\"1\"><stop stop-color=\"#f6e5d8\"/><stop offset=\"1\" stop-color=\"#e7bba5\"/><\/linearGradient><marker id=\"arrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0 0L10 5L0 10Z\" fill=\"#263b49\"/><\/marker><clipPath id=\"lumenClip\"><rect x=\"30\" y=\"105\" width=\"270\" height=\"665\" rx=\"18\"/><\/clipPath><clipPath id=\"cellClip\"><rect x=\"300\" y=\"155\" width=\"590\" height=\"570\" rx=\"45\"/><\/clipPath><\/defs><rect width=\"1300\" height=\"800\" rx=\"12\" fill=\"#c9d4c8\"/><rect x=\"30\" y=\"105\" width=\"270\" height=\"665\" rx=\"18\" fill=\"#d1d8dd\"/><rect x=\"890\" y=\"105\" width=\"380\" height=\"665\" rx=\"18\" fill=\"url(#med)\"/><rect x=\"300\" y=\"155\" width=\"590\" height=\"570\" rx=\"45\" fill=\"url(#cell)\" stroke=\"#8ba9c1\" stroke-width=\"7\"/><text x=\"165\" y=\"78\" text-anchor=\"middle\" font-size=\"23\" font-weight=\"bold\">Tubular lumen<\/text><text x=\"595\" y=\"78\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"bold\">Thin descending limb cell<\/text><text x=\"1080\" y=\"78\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"bold\">Medullary interstitium<\/text><text x=\"165\" y=\"130\" font-size=\"17\" text-anchor=\"middle\">Tubular fluid<\/text><text x=\"1080\" y=\"130\" font-size=\"17\" text-anchor=\"middle\">Hyperosmotic environment<\/text><g id=\"aqps\"><\/g><g id=\"staticArrows\"><\/g><g id=\"particles\" clip-path=\"url(#lumenClip)\"><\/g><g id=\"moving\"><\/g><g id=\"soluteParticles\" clip-path=\"url(#lumenClip)\"><\/g><g id=\"labelGroup\"><text x=\"595\" y=\"245\" font-size=\"21\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#253f5a\">AQP1-mediated water reabsorption<\/text><text x=\"595\" y=\"279\" font-size=\"17\" text-anchor=\"middle\" fill=\"#344f61\">Passive osmosis \u2014 no ATP required<\/text><text x=\"595\" y=\"312\" font-size=\"17\" text-anchor=\"middle\" fill=\"#344f61\">No direct ADH regulation of AQP1 insertion<\/text><text x=\"595\" y=\"580\" font-size=\"18\" text-anchor=\"middle\" fill=\"#495b65\">Very low NaCl permeability in the thin descending limb<\/text><\/g><g font-size=\"19\" fill=\"#233b47\"><text x=\"165\" y=\"692\" text-anchor=\"middle\" font-weight=\"bold\" id=\"lumenOsm\">Tubular fluid: 300 \u2192 600<\/text><text x=\"1080\" y=\"692\" text-anchor=\"middle\" font-weight=\"bold\" id=\"interOsm\">Interstitium: 600<\/text><text x=\"1080\" y=\"718\" text-anchor=\"middle\" font-size=\"15\">mOsm/kg H\u2082O (illustrative)<\/text><\/g><path d=\"M165 175 V610\" stroke=\"#627d91\" stroke-width=\"5\" marker-end=\"url(#arrow)\" stroke-linecap=\"round\"/><text x=\"183\" y=\"394\" font-size=\"16\" fill=\"#4c6171\" transform=\"rotate(90 183 394)\">Tubular fluid flows toward papilla<\/text><text x=\"595\" y=\"668\" font-size=\"19\" text-anchor=\"middle\" font-weight=\"bold\" id=\"outcome\">Water exits; tubular fluid concentrates<\/text><g id=\"blockMark\" opacity=\"0\"><path d=\"M277 393L322 438 M322 393L277 438\" stroke=\"#b92c34\" stroke-width=\"8\" stroke-linecap=\"round\"/><text x=\"345\" y=\"424\" fill=\"#b92c34\" font-size=\"18\" font-weight=\"bold\">Reduced water permeability<\/text><\/g><\/svg><div class=\"legend\"><span><i class=\"dot\" style=\"background:#2b93d0\"><\/i>H\u2082O (moving)<\/span><span><i class=\"dot\" style=\"background:#a58b22\"><\/i>Solutes retained in lumen<\/span><span><i class=\"dot\" style=\"background:#3a8bb9\"><\/i>AQP1 channels<\/span><\/div><div id=\"info\" class=\"panel\"><\/div><div class=\"note\">Teaching model: osmolarity values are illustrative, not predictions of exact segment concentrations. Actual values depend on medullary depth, species, and physiological state. Reduced AQP1 function is a hypothetical transport impairment, not a standard diuretic mechanism.<\/div><\/div><script>\nconst NS='http://www.w3.org/2000/svg', $=s=>document.querySelector(s);const svg=(tag,attrs={},parent)=>{let e=document.createElementNS(NS,tag);for(let [k,v] of Object.entries(attrs))e.setAttribute(k,v);if(parent)parent.appendChild(e);return e};const modes={normal:{rate:1,lum:'300 \u2192 600',inter:600,out:'Water exits; tubular fluid concentrates',info:'<b>Normal:<\/b> AQP1 is constitutively present on both apical and basolateral membranes. Water moves passively from the tubular fluid into the increasingly hyperosmotic medullary interstitium. The descending tubular fluid becomes more concentrated as water is removed.'},dehydration:{rate:1.55,lum:'300 \u2192 900',inter:900,out:'Stronger osmotic gradient \u2192 greater water loss',info:'<b>Dehydration:<\/b> A more concentrated medullary interstitium can enhance water removal from the descending limb. ADH helps maintain medullary hypertonicity and acts on the collecting duct, but does <b>not<\/b> insert AQP1 into this segment.'},overhydration:{rate:.55,lum:'300 \u2192 450',inter:450,out:'Weaker osmotic gradient \u2192 less water loss',info:'<b>Overhydration:<\/b> A weaker medullary osmotic gradient reduces the driving force for water reabsorption. AQP1 remains in the membrane; its presence is not switched on or off by ADH.'},block:{rate:.12,lum:'300 \u2192 ~330',inter:600,out:'Reduced AQP1 permeability \u2192 impaired water removal',info:'<b>Reduced AQP1 function (conceptual):<\/b> Decreasing water permeability limits osmotic water exit despite a hyperosmotic interstitium. Tubular fluid remains relatively dilute compared with normal. This illustrates impaired water transport, not a routine pharmacological treatment.'}};let mode='normal',movingWater=true,showSol=true,showLabels=true,paused=false,last=0,clock=0;const aqps=$('#aqps'),staticArrows=$('#staticArrows'),moving=$('#moving'),solutes=$('#soluteParticles');const channels=[];for(let y of [345,415,485]){for(let x of [300,890]){const g=svg('g',{'class':'aqua'},aqps);svg('rect',{x:x-13,y:y-27,width:26,height:54,rx:10,fill:'#5ba8ce',stroke:'#247cae','stroke-width':3},g);svg('path',{d:`M${x-5} ${y-15} V${y+15} M${x+5} ${y-15} V${y+15}`,stroke:'#d9f4ff','stroke-width':3},g);channels.push(g)}svg('path',{d:`M345 ${y} H845`,stroke:'#398db8','stroke-width':3,'stroke-dasharray':'9 9','marker-end':'url(#arrow)',opacity:.6},staticArrows)}\nconst droplets=[];function addDrop(offset=0){const c=svg('circle',{r:9,fill:'#2996d5',stroke:'#e6f7ff','stroke-width':2},moving);droplets.push({el:c,p:offset,y:[345,415,485][Math.floor(Math.random()*3)],phase:Math.random()*6})}for(let i=0;i<20;i++)addDrop(i/20);const grains=[];for(let i=0;i<25;i++){let c=svg('circle',{r:5.5,fill:'#a58b22',stroke:'#f5ebbc','stroke-width':1},solutes);grains.push({el:c,x:55+Math.random()*205,y:180+Math.random()*500,speed:14+Math.random()*13,phase:Math.random()*6})}function setMode(m){mode=m;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));let s=modes[m];$('#lumenOsm').textContent='Tubular fluid: '+s.lum;$('#interOsm').textContent='Interstitium: '+s.inter;$('#outcome').textContent=s.out;$('#info').innerHTML=s.info;$('#blockMark').setAttribute('opacity',m==='block'?'1':'0');}document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));function toggle(id,cb){$(id).addEventListener('click',()=>{cb();$(id).classList.toggle('on')})}toggle('#water',()=>movingWater=!movingWater);toggle('#solute',()=>showSol=!showSol);toggle('#labels',()=>{showLabels=!showLabels;$('#labelGroup').style.opacity=showLabels?'1':'0'});$('#pause').addEventListener('click',()=>{paused=!paused;$('#pause').classList.toggle('on',paused);$('#pause').textContent=paused?'Resume':'Pause'});function animate(t){let dt=Math.min(.05,(t-last)/1000||0);last=t;if(!paused)clock+=dt;const rate=modes[mode].rate;for(let d of droplets){let p=(d.p+clock*.16*rate)%1;let x=110+p*1060;let opacity=p<.05?p/.05:p>.95?(1-p)/.05:1;d.el.setAttribute('cx',x);d.el.setAttribute('cy',d.y+Math.sin(clock*3+d.phase)*3);d.el.setAttribute('opacity',movingWater?opacity:0);d.el.setAttribute('r',9)}for(let g of grains){if(!paused){g.y+=g.speed*dt;if(g.y>748){g.y=170;g.x=55+Math.random()*205}}g.el.setAttribute('cx',g.x+Math.sin(clock*1.5+g.phase)*5);g.el.setAttribute('cy',g.y);g.el.setAttribute('opacity',showSol?1:0)}requestAnimationFrame(animate)}setMode('normal');requestAnimationFrame(animate);\n<\/script><\/body><\/html>\n", "<!DOCTYPE html><html lang=\"en\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Thick Ascending Limb: Solute Transport<\/title>\n<style>\n:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{margin:0;background:#c9d4c8;font-family:Verdana,\"DejaVu Sans\",sans-serif;color:#1d2a1d}\n#wrap{max-width:1200px;margin:0 auto;padding:12px 12px 28px}\n#bar,#bar2{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 10px;align-items:center}\n#bar span,#bar2 span{font-size:13px;color:#4a5a48;margin-right:2px}\n.sb{--c:#555;border:2px solid var(--c);background:rgba(255,255,255,.35);color:#1d2a1d;border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}\n.sb.on{background:var(--c);color:#fff}.sb.g{--c:#6b7a68}\nsvg{display:block;width:100%;height:auto;user-select:none}\n#info{margin-top:10px;background:#bcc7b8;border-radius:10px;padding:12px 14px;font-size:15px;line-height:1.5;min-height:74px}\n#bar .sb.dot::before{content:\"\";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:7px}#bar .sb.dot.on::before{background:#fff}#bar:not(.pon) .sb.dot::before{display:none}\n<\/style><\/head><body>\n<div id=\"wrap\"><div id=\"bar\"><span>Solutes:<\/span><\/div>\n<svg id=\"fig\" viewBox=\"0 0 1300 800\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Verdana,'DejaVu Sans',sans-serif\">\n<defs id=\"defs\">\n<clipPath id=\"pc\"><rect x=\"30\" y=\"60\" width=\"1240\" height=\"730\" rx=\"18\"/><\/clipPath>\n<pattern id=\"hp\" width=\"10\" height=\"10\" patternUnits=\"userSpaceOnUse\" patternTransform=\"rotate(45)\"><rect width=\"10\" height=\"10\" fill=\"#e0a58f\"/><rect width=\"5\" height=\"10\" fill=\"#b8553a\"/><\/pattern>\n<marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0L10,5L0,10Z\" fill=\"#111\"/><\/marker>\n<\/defs>\n<rect width=\"1300\" height=\"800\" fill=\"#c9d4c8\"/>\n<text x=\"650\" y=\"34\" font-size=\"24\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#111\">THICK ASCENDING LIMB<\/text>\n<g clip-path=\"url(#pc)\"><rect x=\"30\" y=\"60\" width=\"260\" height=\"730\" fill=\"#d4d4d4\"/><\/g>\n<path d=\"M1115,172 L1115,770 A70,24 0 0 0 1255,770 L1255,172 Z\" fill=\"#ffcccc\"/><ellipse cx=\"1185\" cy=\"172\" rx=\"70\" ry=\"24\" fill=\"#ffe3e3\"/>\n<rect x=\"290\" y=\"125\" width=\"590\" height=\"440\" rx=\"40\" fill=\"#cfdae8\" stroke=\"#7d9bc4\" stroke-width=\"7\"/>\n<rect x=\"290\" y=\"625\" width=\"590\" height=\"200\" rx=\"40\" fill=\"#cfdae8\" stroke=\"#7d9bc4\" stroke-width=\"7\"/>\n<rect x=\"405\" y=\"558\" width=\"46\" height=\"70\" fill=\"url(#hp)\" stroke=\"#8a4a38\" stroke-width=\"2\"/>\n<path d=\"M160 215 L205 265 L180 265 L180 335 L140 335 L140 265 L115 265Z\" fill=\"#f6e4a8\"/>\n<text x=\"585\" y=\"100\" font-size=\"20\" text-anchor=\"middle\" fill=\"#111\">Cell of the thick ascending limb<\/text>\n<text x=\"48\" y=\"92\" font-size=\"20\" font-weight=\"bold\" fill=\"#111\">Lumen<\/text><text x=\"1252\" y=\"92\" font-size=\"20\" font-weight=\"bold\" text-anchor=\"end\" fill=\"#111\">Blood<\/text>\n<g fill=\"#fff\" stroke=\"#8a8a8a\" stroke-width=\"2\"><rect x=\"48\" y=\"104\" width=\"86\" height=\"32\" rx=\"3\"/><rect x=\"1168\" y=\"104\" width=\"84\" height=\"32\" rx=\"3\"/><\/g>\n<g font-size=\"19\" fill=\"#111\" text-anchor=\"middle\" dominant-baseline=\"central\"><text id=\"mv\" x=\"91\" y=\"121\"><\/text><text x=\"1210\" y=\"121\">0 mV<\/text><\/g>\n<g id=\"dyn\"><\/g><g id=\"ptc\"><\/g><text id=\"fl\" x=\"160\" y=\"121\" font-size=\"15\" fill=\"#33404c\" dominant-baseline=\"central\">Fluid flow \u2191<\/text><g id=\"fx\"><\/g><\/svg>\n<div id=\"bar2\" style=\"margin:10px 0 0\"><span>Drugs and disease:<\/span><\/div>\n<div id=\"info\"><\/div><\/div>\n<script>\nconst $=s=>document.querySelector(s);\nconst TK={Na:['Na\u207a','#8d8a1b'],K:['K\u207a','#d62d20'],Cl:['Cl\u207b','#2e7d4f'],Ca:['Ca\u00b2\u207a, Mg\u00b2\u207a','#7a5a3a'],H2O:['H\u2082O','#2b6fd6']};\nconst SH={Na:'Na\u207a',K:'K\u207a',Cl:'Cl\u207b',Ca:'Ca\u00b2\u207a/Mg\u00b2\u207a'};\nconst INFO={Na:'<b>Na\u207a<\/b> enters the cell on NKCC2 together with K\u207a and 2 Cl\u207b (secondary active transport), then the Na\u207a\u2013K\u207a ATPase pumps it out to the blood. Some Na\u207a also moves between the cells, pushed by the +7 mV lumen potential.',\nK:'<b>K\u207a<\/b> enters on NKCC2, but most of it leaks straight back into the lumen through ROMK1 (the dotted loop). That recycling keeps enough K\u207a in the lumen for NKCC2 to work and helps create the +7 mV lumen potential. The rest leaves across the blood side (KCC4) or passes between cells.',\nCl:'<b>Cl\u207b<\/b> enters on NKCC2 (two per cycle) and leaves across the blood-side membrane through a Cl\u207b channel (ClC-Kb). Because K\u207a leaks back into the lumen while Cl\u207b leaves toward the blood, the lumen becomes positive.',\nCa:'<b>Ca\u00b2\u207a and Mg\u00b2\u207a<\/b> are reabsorbed between the cells through claudin 16 (dashed arrow), pulled by the +7 mV lumen potential. A Ca\u00b2\u207a-sensing receptor (CaSR) on the blood side detects high blood Ca\u00b2\u207a and turns down ROMK1 and NKCC2, which lowers the potential and sends more Ca\u00b2\u207a and Mg\u00b2\u207a into the urine.',\nH2O:'<b>Water<\/b> cannot cross this segment. The thick ascending limb has no water channels, so NaCl is removed but water stays behind. The tubular fluid becomes dilute, which is why this is called the diluting segment.',\nFUR:'<b>Furosemide<\/b> blocks the Cl\u207b site of NKCC2 from the lumen side. Na\u207a, K\u207a and Cl\u207b stay in the lumen, K\u207a recycling stops, and the lumen potential falls toward 0 mV. Ca\u00b2\u207a and Mg\u00b2\u207a are lost as well, and the result is a strong diuresis.',\nCASR:'<b>High blood Ca\u00b2\u207a<\/b> activates the CaSR, which inhibits ROMK1 and NKCC2. Less K\u207a recycles, the lumen potential falls, and paracellular Ca\u00b2\u207a and Mg\u00b2\u207a reabsorption drops (calciuria).',\nBAR:'<b>Bartter syndrome<\/b> is caused by a loss-of-function mutation in NKCC2, ROMK1 or the Cl\u207b channel (ClC-Kb). Salt entry and K\u207a recycling fail, so it behaves like a permanent furosemide effect: the lumen potential falls, NaCl, Ca\u00b2\u207a and Mg\u00b2\u207a are lost, and more Na\u207a reaches the collecting duct. This causes salt wasting, hypokalemia, metabolic alkalosis and hypercalciuria.',\nCLDN:'<b>Claudin 16 loss<\/b> (familial hypomagnesemia with hypercalciuria and nephrocalcinosis) removes the paracellular route for Ca\u00b2\u207a and Mg\u00b2\u207a. The potential is normal, but these ions cannot cross and are lost in the urine.'};\nconst DEF='Select solutes to follow their routes; others fade. Turn on Moving solutes to watch Na\u207a (olive), Cl\u207b (green), K\u207a (red) and Ca\u00b2\u207a/Mg\u00b2\u207a (brown) rise up the lumen and cross through transporters or between cells. Try furosemide, high blood Ca\u00b2\u207a and claudin 16 loss.';\nconst SP=[['s0','#f4d8db','#d58f98'],['s1','#e2f2f4','#5fb0bd'],['s2','#dcd6ef','#8f84bb'],['s3','#e4f3de','#8fc486'],['s4','#f7e3c6','#d9a468']];\n$('#defs').insertAdjacentHTML('beforeend',SP.map(([i,a,b])=>`<radialGradient id=\"${i}\" cx=\".35\" cy=\".3\" r=\".85\"><stop offset=\"0\" stop-color=\"#fff\"/><stop offset=\".3\" stop-color=\"${a}\"/><stop offset=\"1\" stop-color=\"${b}\"/><\/radialGradient>`).join(''));\nconst arrow=(x1,y,x2)=>`<line x1=\"${x1}\" y1=\"${y}\" x2=\"${x2}\" y2=\"${y}\" stroke=\"#111\" stroke-width=\"2.4\" marker-end=\"url(#ah)\"/>`;\nconst txt=(t,x,y,s=20)=>`<text x=\"${x}\" y=\"${y}\" font-size=\"${s}\" fill=\"#111\" dominant-baseline=\"central\">${t}<\/text>`;\nconst el=(k,i)=>`<g class=\"el\" data-k=\"${k}\">${i}<\/g>`;\nconst lab=(t,c='#1d2a1d')=>t?`<text y=\"1\" font-size=\"15\" font-weight=\"bold\" fill=\"${c}\" text-anchor=\"middle\" dominant-baseline=\"central\" pointer-events=\"none\">${t}<\/text>`:'';\nconst tp=(k,x,y,f,n,l,c)=>`<g class=\"el tp\" data-k=\"${k}\" data-x=\"${x}\" data-y=\"${y}\" transform=\"translate(${x},${y})\"><title>${n}<\/title><circle r=\"34\" fill=\"url(#${f})\" stroke=\"#555\" stroke-opacity=\".5\" stroke-width=\"2\"/>${lab(l,c)}<\/g>`;\nconst X=(x,y)=>`<line x1=\"${x-16}\" y1=\"${y-16}\" x2=\"${x+16}\" y2=\"${y+16}\" stroke=\"#c0281f\" stroke-width=\"5\"/><line x1=\"${x+16}\" y1=\"${y-16}\" x2=\"${x-16}\" y2=\"${y+16}\" stroke=\"#c0281f\" stroke-width=\"5\"/>`;\nconst NT=(t,x,y)=>`<text x=\"${x}\" y=\"${y}\" font-size=\"15\" font-weight=\"bold\" fill=\"#c0281f\" dominant-baseline=\"central\">${t}<\/text>`;\nlet h='';\nh+=el('Na',arrow(225,266,355)+txt('Na\u207a',366,266))+el('Cl',arrow(225,306,355)+txt('2Cl\u207b',366,306))+el('K',arrow(225,346,355)+txt('K\u207a',366,346));\nh+=el('K',arrow(355,430,225)+txt('K\u207a',366,430));\nh+=el('Na',arrow(815,189,945)+txt('Na\u207a',957,189))+el('K',arrow(945,241,815)+txt('K\u207a',957,241));\nh+=el('Cl',arrow(815,330,945)+txt('Cl\u207b',957,330))+el('K',arrow(815,420,945)+txt('K\u207a',957,420));\nh+=el('Na K Ca',`<rect x=\"40\" y=\"535\" width=\"100\" height=\"120\" fill=\"#fff6d8\" stroke=\"#a8956a\" stroke-width=\"2\"/><g font-size=\"19\" fill=\"#111\" text-anchor=\"middle\"><text x=\"90\" y=\"565\">Na\u207a<\/text><text x=\"90\" y=\"593\">K\u207a<\/text><text x=\"90\" y=\"621\">Ca\u00b2\u207a<\/text><text x=\"90\" y=\"649\">Mg\u00b2\u207a<\/text><\/g><path d=\"M150 600 L1090 600\" stroke=\"#111\" stroke-width=\"2.4\" stroke-dasharray=\"8 6\" fill=\"none\" marker-end=\"url(#ah)\"/><text x=\"560\" y=\"582\" font-size=\"18\" font-weight=\"bold\" fill=\"#111\">Claudin 16<\/text>`);\nh+=el('H2O','<text x=\"48\" y=\"725\" font-size=\"26\" font-weight=\"bold\" fill=\"#2b6fd6\" dominant-baseline=\"central\">H\u2082O<\/text>'+arrow(130,725,248)+X(268,725)+txt('Impermeable to water',48,765,15));\nh+=tp('Na Cl K',290,306,'s0','Na\u207a\u2013K\u207a\u20132Cl\u207b cotransporter (NKCC2)','NKCC2')+tp('K',290,430,'s1','ROMK1 K\u207a channel','ROMK1');\nh+=tp('Na K',880,215,'s3','Na\u207a\u2013K\u207a ATPase','ATP','#2a4a9a')+tp('Cl',880,330,'s2','Cl\u207b channel (ClC-Kb)','ClC-Kb')+tp('K',880,420,'s2','KCC4 cotransporter','KCC4')+tp('Ca',880,520,'s4','Ca\u00b2\u207a-sensing receptor (CaSR)','CaSR')+el('Ca',txt('Senses blood Ca\u00b2\u207a',925,520,15));\nconst FL=[['Na',150,266,430],['Cl',150,306,430],['K',150,346,430],['K',430,430,150],['Na',780,189,1060],['K',1060,241,780],['Cl',780,330,1060],['K',780,420,1060],['Na',150,600,1060,0],['K',150,600,1060,.17],['Ca',150,600,1060,.33]];\nFL.forEach((f,i)=>{[0,.5].forEach(p=>{const l=SH[f[0]],w=Math.max(42,l.length*10+18);h+=`<g class=\"tk\" data-f=\"${i}\" data-p=\"${p+(f[4]||0)}\" style=\"display:none\"><rect x=\"${-w/2}\" y=\"-13\" width=\"${w}\" height=\"26\" rx=\"13\" fill=\"${TK[f[0]][1]}\"/><text font-size=\"15\" font-weight=\"bold\" fill=\"#fff\" text-anchor=\"middle\" dominant-baseline=\"central\">${l}<\/text><\/g>`})});\n$('#dyn').innerHTML=h;\n$('#fx').innerHTML=`<g class=\"fx\" data-k=\"FUR\" style=\"display:none\">${X(290,306)}${NT('Furosemide blocks NKCC2',40,160)}${NT('Lumen potential falls toward 0 mV',40,180)}<\/g><g class=\"fx\" data-k=\"CASR\" style=\"display:none\">${X(290,306)}${X(290,430)}${NT('High Ca\u00b2\u207a: CaSR inhibits NKCC2 and ROMK1',40,160)}${NT('Less recycling, lower potential',40,180)}<\/g><g class=\"fx\" data-k=\"BAR\" style=\"display:none\">${X(290,306)}${X(290,430)}${X(880,330)}${NT('Bartter: NKCC2, ROMK1 or ClC-Kb defective',40,160)}${NT('Salt wasting, low potential, Ca\u00b2\u207a lost',40,180)}<\/g><g class=\"fx\" data-k=\"CLDN\" style=\"display:none\">${X(428,593)}${NT('Claudin 16 lost: Ca\u00b2\u207a and Mg\u00b2\u207a stay in lumen',40,160)}<\/g>`;\nconst act=new Set();let last=null;const bar=$('#bar');\nconst FX={FUR:['Furosemide','#a0302a'],CASR:['High blood Ca\u00b2\u207a (CaSR)','#5a6b7d'],CLDN:['Claudin 16 loss','#7a3b8c'],BAR:['Bartter syndrome','#2f6f5e']};\nconst mk=(par,k,name,col)=>{const b=document.createElement('button');b.className='sb';b.dataset.k=k;b.style.setProperty('--c',col);b.textContent=name;b.onclick=()=>{if(act.has(k))act.delete(k);else{act.add(k);last=k}if(!act.has(last))last=[...act].pop()||null;upd()};par.appendChild(b)};\nObject.keys(TK).forEach(k=>mk(bar,k,TK[k][0],TK[k][1]));\n['Na','K','Cl','Ca'].forEach(k=>bar.querySelector(`[data-k=\"${k}\"]`).classList.add('dot'));\nObject.keys(FX).forEach(k=>mk($('#bar2'),k,FX[k][0],FX[k][1]));\n[['All',()=>{Object.keys(TK).forEach(k=>act.add(k));last='Na'}],['Clear',()=>{act.clear();last=null}]].forEach(([n,f])=>{const b=document.createElement('button');b.className='sb g';b.textContent=n;b.onclick=()=>{f();upd()};bar.appendChild(b)});\nfunction upd(){$('#mv').textContent='+'+(act.has('FUR')?1:act.has('BAR')?2:act.has('CASR')?3:7)+' mV';\nconst any=[...act].some(k=>TK[k]);document.querySelectorAll('.fx').forEach(e=>{e.style.display=act.has(e.dataset.k)?'':'none'});\ndocument.querySelectorAll('.el').forEach(e=>{const m=e.dataset.k.split(' ').some(k=>act.has(k));e.setAttribute('opacity',any&&!m?.28:1)});\ndocument.querySelectorAll('.sb[data-k]').forEach(b=>b.classList.toggle('on',act.has(b.dataset.k)));\n$('#info').innerHTML=last?INFO[last]+(act.size>1?`<br><span style=\"font-size:13px;opacity:.75\">Showing ${act.size} items; the text describes the one you picked last.<\/span>`:''):DEF}\nconst PC={Na:'#8d8a1b',Cl:'#2e7d4f',K:'#d62d20',Ca:'#7a5a3a'},PN={Na:'Na\u207a',Cl:'Cl\u207b',K:'K\u207a',Ca:'Ca\u00b2\u207a or Mg\u00b2\u207a'},PG=$('#ptc'),PT=[];\nconst LY={nNa:266,nCl:306,nK:346,rk:346,pa:600};\nconst RTE={nNa:[[290,266],[800,266],[800,189],[945,189],[1150,189]],nCl:[[290,306],[800,330],[1150,330]],nK:[[290,346],[800,420],[1150,420]],rk:[[290,346],[540,346],[540,430],[290,430],[240,430]],pa:[[290,600],[1150,600]]};\nfunction prob(p){if(p.rt==='pa'){let b=.8;if(act.has('FUR'))b=.2;else if(act.has('BAR'))b=.3;else if(act.has('CASR'))b=.5;if(act.has('CLDN')&&p.kind==='Ca')b=.05;return b}\nlet b=.85;if(act.has('FUR'))b=.05;else if(act.has('BAR'))b=.1;else if(act.has('CASR'))b=.45;return b}\nfunction mkP(pre){const u=Math.random(),kind=u<.35?'Na':u<.65?'Cl':u<.85?'K':'Ca',v=Math.random();\nconst rt=kind==='Ca'?'pa':kind==='Na'?(v<.35?'pa':'nNa'):kind==='Cl'?'nCl':(v<.3?'pa':'nK'),ly=LY[rt];\nconst g=document.createElementNS('http://www.w3.org/2000/svg','g');g.innerHTML=`<title>${PN[kind]}<\/title><circle r=\"10\" fill=\"${PC[kind]}\" stroke=\"#fff\" stroke-width=\"2\"/>`;PG.appendChild(g);\nPT.push({kind,rt,ly,x:50+Math.random()*210,y:pre?ly+40+Math.random()*(770-ly-40):780,vy:36+Math.random()*14,ph:Math.random()*6.3,st:'drift',a:pre?1:0,fade:1,g})}\nlet showP=false;\nfunction stepP(t,dt){PG.style.display=showP?'':'none';$('#fl').style.display=showP?'':'none';if(!showP)return;\nif(PT.length<60&&t-(stepP.s||0)>.45){stepP.s=t;mkP(0)}\nconst any=Object.keys(TK).some(k=>act.has(k));\nfor(let i=PT.length-1;i>=0;i--){const p=PT[i];p.a=Math.min(1,p.a+dt*2);\nif(p.st==='drift'){p.y-=p.vy*dt;p.x=Math.min(262,Math.max(48,p.x+Math.sin(t*1.7+p.ph)*12*dt));if(!p.passed&&p.y<=p.ly+70)p.st='appr';p.fade=Math.max(0,Math.min(1,(p.y-130)/40))}\nelse if(p.st==='appr'){const dx=252-p.x,dy=p.ly-p.y,d=Math.hypot(dx,dy);if(d<4){if(Math.random()<prob(p)){p.back=p.rt==='nK'&&Math.random()<(act.has('BAR')?.2:act.has('CASR')?.35:.7);p.wp=RTE[p.back?'rk':p.rt].map(a=>a.slice());p.st='path'}else{p.passed=true;p.st='drift'}}else{const s=Math.min(d,95*dt);p.x+=dx/d*s;p.y+=dy/d*s}}\nelse if(p.st==='path'){const w=p.wp[0],dx=w[0]-p.x,dy=w[1]-p.y,d=Math.hypot(dx,dy),s=150*dt;if(d<=s){p.x=w[0];p.y=w[1];p.wp.shift();if(!p.wp.length){if(p.back){p.st='drift';p.passed=true}else p.st='cap'}}else{p.x+=dx/d*s;p.y+=dy/d*s}}\nelse{p.y+=40*dt;p.fade-=dt*.9}\nif((p.st==='drift'&&p.y<125)||p.fade<=0){p.g.remove();PT.splice(i,1);continue}\nconst on=act.has(p.kind);p.g.setAttribute('opacity',(p.a*p.fade*(any&&!on?.28:1)).toFixed(2));\np.g.setAttribute('transform',`translate(${p.x.toFixed(1)},${p.y.toFixed(1)}) scale(${on?1.3:1})`)}}\n{const b=document.createElement('button');b.className='sb g';b.textContent='Moving solutes';b.onclick=()=>{showP=!showP;b.classList.toggle('on',showP);bar.classList.toggle('pon',showP)};bar.appendChild(b)}\nfor(let i=0;i<24;i++)mkP(1);\nconst tps=[...document.querySelectorAll('.tp')],tks=[...document.querySelectorAll('.tk')];\nlet pt=0;function loop(ts){const t=ts/1000,dt=Math.min(.05,t-(pt||t));pt=t;stepP(t,dt);\ntks.forEach(k=>{const f=FL[k.dataset.f],on=act.has(f[0]);k.style.display=on?'':'none';if(on){const u=(t/2.6+ +k.dataset.p)%1;k.setAttribute('transform',`translate(${f[1]+(f[3]-f[1])*u},${f[2]})`);k.setAttribute('opacity',Math.sin(Math.PI*u).toFixed(2))}});\ntps.forEach(p=>{const on=p.dataset.k.split(' ').some(k=>act.has(k)),s=on?1+.09*Math.sin(t*4):1;p.setAttribute('transform',`translate(${p.dataset.x},${p.dataset.y}) scale(${s.toFixed(3)})`)});\nrequestAnimationFrame(loop)}\nupd();requestAnimationFrame(loop);\n<\/script><\/body><\/html>\n", "<!DOCTYPE html><html lang=\"en\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Early Distal Tubule: Solute Transport<\/title>\n<style>\n:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{margin:0;background:#c9d4c8;font-family:Verdana,\"DejaVu Sans\",sans-serif;color:#1d2a1d}\n#wrap{max-width:1200px;margin:0 auto;padding:12px 12px 28px}\n#bar,#bar2{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 10px;align-items:center}\n#bar span,#bar2 span{font-size:13px;color:#4a5a48;margin-right:2px}\n.sb{--c:#555;border:2px solid var(--c);background:rgba(255,255,255,.35);color:#1d2a1d;border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}\n.sb.on{background:var(--c);color:#fff}.sb.g{--c:#6b7a68}\nsvg{display:block;width:100%;height:auto;user-select:none}\n#info{margin-top:10px;background:#bcc7b8;border-radius:10px;padding:12px 14px;font-size:15px;line-height:1.5;min-height:74px}\n#bar .sb.dot::before{content:\"\";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:7px}#bar .sb.dot.on::before{background:#fff}#bar:not(.pon) .sb.dot::before{display:none}\n<\/style><\/head><body>\n<div id=\"wrap\"><div id=\"bar\"><span>Solutes:<\/span><\/div>\n<svg id=\"fig\" viewBox=\"0 0 1300 800\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Verdana,'DejaVu Sans',sans-serif\">\n<defs id=\"defs\">\n<clipPath id=\"pc\"><rect x=\"30\" y=\"60\" width=\"1240\" height=\"730\" rx=\"18\"/><\/clipPath>\n<marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0L10,5L0,10Z\" fill=\"#111\"/><\/marker>\n<\/defs>\n<rect width=\"1300\" height=\"800\" fill=\"#c9d4c8\"/>\n<text x=\"650\" y=\"34\" font-size=\"24\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#111\">EARLY DISTAL TUBULE<\/text>\n<g clip-path=\"url(#pc)\"><rect x=\"30\" y=\"60\" width=\"260\" height=\"730\" fill=\"#d4d4d4\"/><\/g>\n<path d=\"M1115,172 L1115,770 A70,24 0 0 0 1255,770 L1255,172 Z\" fill=\"#ffcccc\"/><ellipse cx=\"1185\" cy=\"172\" rx=\"70\" ry=\"24\" fill=\"#ffe3e3\"/>\n<rect x=\"290\" y=\"125\" width=\"590\" height=\"650\" rx=\"40\" fill=\"#cfdae8\" stroke=\"#7d9bc4\" stroke-width=\"7\"/>\n<path d=\"M140 190 L180 190 L180 260 L205 260 L160 310 L115 260 L140 260Z\" fill=\"#f6e4a8\"/>\n<text x=\"585\" y=\"100\" font-size=\"20\" text-anchor=\"middle\" fill=\"#111\">Cell of the early distal tubule<\/text>\n<text x=\"48\" y=\"92\" font-size=\"20\" font-weight=\"bold\" fill=\"#111\">Lumen<\/text><text x=\"1252\" y=\"92\" font-size=\"20\" font-weight=\"bold\" text-anchor=\"end\" fill=\"#111\">Blood<\/text>\n<g fill=\"#fff\" stroke=\"#8a8a8a\" stroke-width=\"2\"><rect x=\"48\" y=\"104\" width=\"86\" height=\"32\" rx=\"3\"/><rect x=\"1168\" y=\"104\" width=\"84\" height=\"32\" rx=\"3\"/><\/g>\n<g font-size=\"19\" fill=\"#111\" text-anchor=\"middle\" dominant-baseline=\"central\"><text x=\"91\" y=\"121\">\u221210 mV<\/text><text x=\"1210\" y=\"121\">0 mV<\/text><\/g>\n<text x=\"48\" y=\"440\" font-size=\"17\" font-weight=\"bold\" fill=\"#8a2a2a\">Thiazide<\/text><text x=\"48\" y=\"462\" font-size=\"17\" font-weight=\"bold\" fill=\"#8a2a2a\">diuretics<\/text>\n<g id=\"dyn\"><\/g><g id=\"ptc\"><\/g><text id=\"fl\" x=\"160\" y=\"121\" font-size=\"15\" fill=\"#33404c\" dominant-baseline=\"central\">Fluid flow \u2193<\/text><g id=\"fx\"><\/g><\/svg>\n<div id=\"bar2\" style=\"margin:10px 0 0\"><span>Drugs and disease:<\/span><\/div>\n<div id=\"info\"><\/div><\/div>\n<script>\nconst $=s=>document.querySelector(s);\nconst TK={Na:['Na\u207a','#8d8a1b'],K:['K\u207a','#d62d20'],Cl:['Cl\u207b','#2e7d4f'],Ca:['Ca\u00b2\u207a','#7a5a3a'],Mg:['Mg\u00b2\u207a','#c2751f'],H2O:['H\u2082O','#2b6fd6']};\nconst SH={Na:'Na\u207a',K:'K\u207a',Cl:'Cl\u207b',Ca:'Ca\u00b2\u207a',Mg:'Mg\u00b2\u207a'};\nconst INFO={Na:'<b>Na\u207a<\/b> enters with Cl\u207b on the Na\u207a\u2013Cl\u207b cotransporter (NCC), which is electroneutral. The Na\u207a\u2013K\u207a ATPase pumps it out to the blood. On the blood side, Na\u207a also re-enters in exchange for Ca\u00b2\u207a (NCX), and the low cell Na\u207a keeps that exchange working.',\nK:'<b>K\u207a<\/b> is taken into the cell from the blood by the Na\u207a\u2013K\u207a ATPase (3 Na\u207a out, 2 K\u207a in), which builds the Na\u207a gradient used by NCC and NCX.',\nCl:'<b>Cl\u207b<\/b> enters on NCC with Na\u207a and leaves the cell through a Cl\u207b channel on the blood side (ClC-Kb).',\nCa:'<b>Ca\u00b2\u207a<\/b> is reabsorbed through the cell. It enters through TRPV5 channels on the lumen side, travels across the cytoplasm bound to calbindin (dashed arrow), and is pushed out by the Na\u207a/Ca\u00b2\u207a exchanger (NCX) on the blood side. PTH and vitamin D increase this.',\nMg:'<b>Mg\u00b2\u207a<\/b> enters through TRPM6 channels, helped by the negative lumen potential (\u221210 mV), and crosses to the blood by a basolateral carrier (the arrow is simplified). The distal tubule is the last place where urinary Mg\u00b2\u207a is controlled.',\nH2O:'<b>Water<\/b> cannot cross this segment, so NaCl removal further dilutes the tubular fluid. The early distal tubule is sometimes called the cortical diluting segment.',\nTHZ:'<b>Thiazide diuretics<\/b> block NCC from the lumen side, so less Na\u207a and Cl\u207b are reabsorbed (a mild diuresis). Less Na\u207a and Cl\u207b in the cell steepens the gradient for NCX and hyperpolarizes the cell, so more Ca\u00b2\u207a is reabsorbed and urinary Ca\u00b2\u207a falls (useful for calcium kidney stones).',\nGIT:'<b>Gitelman syndrome<\/b> is an inherited loss of NCC function (SLC12A3 mutation), like lifelong thiazide use. It causes salt wasting, hypokalemia, metabolic alkalosis, hypomagnesemia (TRPM6 is downregulated, so Mg\u00b2\u207a is lost) and hypocalciuria. It is usually milder than Bartter syndrome.'};\nconst DEF='Select solutes to follow their routes; others fade. Turn on Moving solutes to watch Na\u207a (olive), Cl\u207b (green), Ca\u00b2\u207a (brown) and Mg\u00b2\u207a (orange) drift down the lumen and cross the cell. Try thiazide diuretics and Gitelman syndrome.';\nconst SP=[['s0','#f4d8db','#d58f98'],['s1','#e2f2f4','#5fb0bd'],['s2','#dcd6ef','#8f84bb'],['s3','#e4f3de','#8fc486'],['s4','#f7e3c6','#d9a468']];\n$('#defs').insertAdjacentHTML('beforeend',SP.map(([i,a,b])=>`<radialGradient id=\"${i}\" cx=\".35\" cy=\".3\" r=\".85\"><stop offset=\"0\" stop-color=\"#fff\"/><stop offset=\".3\" stop-color=\"${a}\"/><stop offset=\"1\" stop-color=\"${b}\"/><\/radialGradient>`).join(''));\nconst arrow=(x1,y,x2)=>`<line x1=\"${x1}\" y1=\"${y}\" x2=\"${x2}\" y2=\"${y}\" stroke=\"#111\" stroke-width=\"2.4\" marker-end=\"url(#ah)\"/>`;\nconst txt=(t,x,y,s=20)=>`<text x=\"${x}\" y=\"${y}\" font-size=\"${s}\" fill=\"#111\" dominant-baseline=\"central\">${t}<\/text>`;\nconst el=(k,i)=>`<g class=\"el\" data-k=\"${k}\">${i}<\/g>`;\nconst lab=(t,c='#1d2a1d',s=15)=>t?`<text y=\"1\" font-size=\"${s}\" font-weight=\"bold\" fill=\"${c}\" text-anchor=\"middle\" dominant-baseline=\"central\" pointer-events=\"none\">${t}<\/text>`:'';\nconst tp=(k,x,y,f,n,l,c,s)=>`<g class=\"el tp\" data-k=\"${k}\" data-x=\"${x}\" data-y=\"${y}\" transform=\"translate(${x},${y})\"><title>${n}<\/title><circle r=\"34\" fill=\"url(#${f})\" stroke=\"#555\" stroke-opacity=\".5\" stroke-width=\"2\"/>${lab(l,c,s)}<\/g>`;\nconst X=(x,y)=>`<line x1=\"${x-16}\" y1=\"${y-16}\" x2=\"${x+16}\" y2=\"${y+16}\" stroke=\"#c0281f\" stroke-width=\"5\"/><line x1=\"${x+16}\" y1=\"${y-16}\" x2=\"${x-16}\" y2=\"${y+16}\" stroke=\"#c0281f\" stroke-width=\"5\"/>`;\nconst NT=(t,x,y)=>`<text x=\"${x}\" y=\"${y}\" font-size=\"15\" font-weight=\"bold\" fill=\"#c0281f\" dominant-baseline=\"central\">${t}<\/text>`;\nlet h='';\nh+=el('Mg',arrow(225,190,355)+txt('Mg\u00b2\u207a',366,190))+el('Ca',arrow(225,300,355)+txt('Ca\u00b2\u207a',366,300));\nh+=el('Na',arrow(225,404,355)+txt('Na\u207a',366,404))+el('Cl',arrow(225,456,355)+txt('Cl\u207b',366,456));\nh+=el('Na',arrow(815,189,945)+txt('Na\u207a',957,189))+el('K',arrow(945,241,815)+txt('K\u207a',957,241));\nh+=el('Cl',arrow(815,420,945)+txt('Cl\u207b',957,420))+el('Mg',arrow(815,520,945)+txt('Mg\u00b2\u207a',957,520));\nh+=el('Ca',arrow(815,614,945)+txt('Ca\u00b2\u207a',957,614))+el('Na',arrow(945,666,815)+txt('Na\u207a',957,666));\nh+=el('Ca','<path d=\"M400 300 C560 300 620 360 600 450 S560 600 780 636\" fill=\"none\" stroke=\"#111\" stroke-width=\"2.2\" stroke-dasharray=\"7 5\" marker-end=\"url(#ah)\"/><text x=\"620\" y=\"400\" font-size=\"15\" fill=\"#111\">calbindin<\/text>');\nh+=el('H2O','<text x=\"48\" y=\"700\" font-size=\"26\" font-weight=\"bold\" fill=\"#2b6fd6\" dominant-baseline=\"central\">H\u2082O<\/text>'+arrow(130,700,248)+X(268,700)+txt('Impermeable to water',48,740,15));\nh+=tp('Mg',290,190,'s2','TRPM6 Mg\u00b2\u207a channel','TRPM6','#1d2a1d',13)+tp('Ca',290,300,'s1','TRPV5 Ca\u00b2\u207a channel','TRPV5','#1d2a1d',13)+tp('Na Cl',290,430,'s0','Na\u207a\u2013Cl\u207b cotransporter (NCC)','NCC');\nh+=tp('Na K',880,215,'s3','Na\u207a\u2013K\u207a ATPase','ATP','#2a4a9a')+tp('Cl',880,420,'s2','Cl\u207b channel (ClC-Kb)','ClC-Kb','#1d2a1d',13)+tp('Ca Na',880,640,'s4','Na\u207a/Ca\u00b2\u207a exchanger (NCX)','NCX');\nconst FL=[['Mg',150,190,430],['Ca',150,300,430],['Na',150,404,430],['Cl',150,456,430],['Na',780,189,1060],['K',1060,241,780],['Cl',780,420,1060],['Mg',780,520,1060],['Ca',780,614,1060],['Na',1060,666,780]];\nFL.forEach((f,i)=>{[0,.5].forEach(p=>{const l=SH[f[0]],w=Math.max(42,l.length*10+18);h+=`<g class=\"tk\" data-f=\"${i}\" data-p=\"${p}\" style=\"display:none\"><rect x=\"${-w/2}\" y=\"-13\" width=\"${w}\" height=\"26\" rx=\"13\" fill=\"${TK[f[0]][1]}\"/><text font-size=\"15\" font-weight=\"bold\" fill=\"#fff\" text-anchor=\"middle\" dominant-baseline=\"central\">${l}<\/text><\/g>`})});\n$('#dyn').innerHTML=h;\n$('#fx').innerHTML=`<g class=\"fx\" data-k=\"THZ\" style=\"display:none\">${X(290,430)}${NT('Thiazide blocks NCC',40,350)}${NT('Ca\u00b2\u207a reabsorption rises',40,370)}<\/g><g class=\"fx\" data-k=\"GIT\" style=\"display:none\">${X(290,430)}${X(290,190)}${NT('Gitelman: NCC defective',40,350)}${NT('Mg\u00b2\u207a lost, Ca\u00b2\u207a retained',40,370)}<\/g>`;\nconst act=new Set();let last=null;const bar=$('#bar');\nconst FX={THZ:['Thiazide diuretics','#a0302a'],GIT:['Gitelman syndrome','#7a3b8c']};\nconst mk=(par,k,name,col)=>{const b=document.createElement('button');b.className='sb';b.dataset.k=k;b.style.setProperty('--c',col);b.textContent=name;b.onclick=()=>{if(act.has(k))act.delete(k);else{act.add(k);last=k}if(!act.has(last))last=[...act].pop()||null;upd()};par.appendChild(b)};\nObject.keys(TK).forEach(k=>mk(bar,k,TK[k][0],TK[k][1]));\n['Na','Cl','Ca','Mg'].forEach(k=>bar.querySelector(`[data-k=\"${k}\"]`).classList.add('dot'));\nObject.keys(FX).forEach(k=>mk($('#bar2'),k,FX[k][0],FX[k][1]));\n[['All',()=>{Object.keys(TK).forEach(k=>act.add(k));last='Na'}],['Clear',()=>{act.clear();last=null}]].forEach(([n,f])=>{const b=document.createElement('button');b.className='sb g';b.textContent=n;b.onclick=()=>{f();upd()};bar.appendChild(b)});\nfunction upd(){const any=[...act].some(k=>TK[k]);document.querySelectorAll('.fx').forEach(e=>{e.style.display=act.has(e.dataset.k)?'':'none'});\ndocument.querySelectorAll('.el').forEach(e=>{const m=e.dataset.k.split(' ').some(k=>act.has(k));e.setAttribute('opacity',any&&!m?.28:1)});\ndocument.querySelectorAll('.sb[data-k]').forEach(b=>b.classList.toggle('on',act.has(b.dataset.k)));\n$('#info').innerHTML=last?INFO[last]+(act.size>1?`<br><span style=\"font-size:13px;opacity:.75\">Showing ${act.size} items; the text describes the one you picked last.<\/span>`:''):DEF}\nconst PC={Na:'#8d8a1b',Cl:'#2e7d4f',Ca:'#7a5a3a',Mg:'#c2751f'},PN={Na:'Na\u207a',Cl:'Cl\u207b',Ca:'Ca\u00b2\u207a',Mg:'Mg\u00b2\u207a'},PG=$('#ptc'),PT=[];\nconst LY={mg:190,ca:300,na:404,cl:456};\nconst RTE={mg:[[290,190],[600,190],[800,520],[1150,520]],ca:[[290,300],[480,300],[600,450],[700,610],[800,636],[1150,636]],na:[[290,404],[800,404],[800,189],[945,189],[1150,189]],cl:[[290,456],[800,420],[1150,420]]};\nfunction prob(p){const g=act.has('GIT'),t=act.has('THZ');\nif(p.rt==='na'||p.rt==='cl')return g||t?.05:.85;\nif(p.rt==='ca')return g||t?.9:.6;\nreturn g?.25:t?.45:.6}\nfunction mkP(pre){const u=Math.random(),kind=u<.3?'Na':u<.6?'Cl':u<.8?'Ca':'Mg',rt=kind.toLowerCase(),ly=LY[rt];\nconst g=document.createElementNS('http://www.w3.org/2000/svg','g');g.innerHTML=`<title>${PN[kind]}<\/title><circle r=\"10\" fill=\"${PC[kind]}\" stroke=\"#fff\" stroke-width=\"2\"/>`;PG.appendChild(g);\nPT.push({kind,rt,ly,x:50+Math.random()*210,y:pre?140+Math.random()*Math.max(10,ly-220):140,vy:36+Math.random()*14,ph:Math.random()*6.3,st:'drift',a:pre?1:0,fade:1,g})}\nlet showP=false;\nfunction stepP(t,dt){PG.style.display=showP?'':'none';$('#fl').style.display=showP?'':'none';if(!showP)return;\nif(PT.length<60&&t-(stepP.s||0)>.45){stepP.s=t;mkP(0)}\nconst any=Object.keys(TK).some(k=>act.has(k));\nfor(let i=PT.length-1;i>=0;i--){const p=PT[i];p.a=Math.min(1,p.a+dt*2);\nif(p.st==='drift'){p.y+=p.vy*dt;p.x=Math.min(262,Math.max(48,p.x+Math.sin(t*1.7+p.ph)*12*dt));if(!p.passed&&p.y>=p.ly-70)p.st='appr';p.fade=Math.max(0,Math.min(1,(772-p.y)/40))}\nelse if(p.st==='appr'){const dx=252-p.x,dy=p.ly-p.y,d=Math.hypot(dx,dy);if(d<4){if(Math.random()<prob(p)){p.wp=RTE[p.rt].map(a=>a.slice());p.st='path'}else{p.passed=true;p.st='drift'}}else{const s=Math.min(d,95*dt);p.x+=dx/d*s;p.y+=dy/d*s}}\nelse if(p.st==='path'){const w=p.wp[0],dx=w[0]-p.x,dy=w[1]-p.y,d=Math.hypot(dx,dy),s=150*dt;if(d<=s){p.x=w[0];p.y=w[1];p.wp.shift();if(!p.wp.length)p.st='cap'}else{p.x+=dx/d*s;p.y+=dy/d*s}}\nelse{p.y+=40*dt;p.fade-=dt*.9}\nif((p.st==='drift'&&p.y>775)||p.fade<=0){p.g.remove();PT.splice(i,1);continue}\nconst on=act.has(p.kind);p.g.setAttribute('opacity',(p.a*p.fade*(any&&!on?.28:1)).toFixed(2));\np.g.setAttribute('transform',`translate(${p.x.toFixed(1)},${p.y.toFixed(1)}) scale(${on?1.3:1})`)}}\n{const b=document.createElement('button');b.className='sb g';b.textContent='Moving solutes';b.onclick=()=>{showP=!showP;b.classList.toggle('on',showP);bar.classList.toggle('pon',showP)};bar.appendChild(b)}\nfor(let i=0;i<24;i++)mkP(1);\nconst tps=[...document.querySelectorAll('.tp')],tks=[...document.querySelectorAll('.tk')];\nlet pt=0;function loop(ts){const t=ts/1000,dt=Math.min(.05,t-(pt||t));pt=t;stepP(t,dt);\ntks.forEach(k=>{const f=FL[k.dataset.f],on=act.has(f[0]);k.style.display=on?'':'none';if(on){const u=(t/2.6+ +k.dataset.p)%1;k.setAttribute('transform',`translate(${f[1]+(f[3]-f[1])*u},${f[2]})`);k.setAttribute('opacity',Math.sin(Math.PI*u).toFixed(2))}});\ntps.forEach(p=>{const on=p.dataset.k.split(' ').some(k=>act.has(k)),s=on?1+.09*Math.sin(t*4):1;p.setAttribute('transform',`translate(${p.dataset.x},${p.dataset.y}) scale(${s.toFixed(3)})`)});\nrequestAnimationFrame(loop)}\nupd();requestAnimationFrame(loop);\n<\/script><\/body><\/html>\n", "<!DOCTYPE html><html lang=\"en\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Late DCT and Collecting Duct: Solute Transport<\/title>\n<style>\n:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{margin:0;background:#c9d4c8;font-family:Verdana,\"DejaVu Sans\",sans-serif;color:#1d2a1d}\n#wrap{max-width:1200px;margin:0 auto;padding:12px 12px 28px}\n#bar,#bar2{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 10px;align-items:center}\n#bar span,#bar2 span{font-size:13px;color:#4a5a48;margin-right:2px}\n.sb{--c:#555;border:2px solid var(--c);background:rgba(255,255,255,.35);color:#1d2a1d;border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}\n.sb.on{background:var(--c);color:#fff}.sb.g{--c:#6b7a68}\nsvg{display:block;width:100%;height:auto;user-select:none}\n#info{margin-top:10px;background:#bcc7b8;border-radius:10px;padding:12px 14px;font-size:15px;line-height:1.5;min-height:74px}\n#bar .sb.dot::before{content:\"\";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:7px}#bar .sb.dot.on::before{background:#fff}#bar:not(.pon) .sb.dot::before{display:none}\n\n/* Gentle fades for all toggled transporters, pathways and annotations */\n.sb{transition:background-color .3s ease,color .3s ease,border-color .3s ease,transform .25s ease}\n.sb:active{transform:scale(.96)}\n.el,.al,.be,.ald,.fx,.tk,#adh-water-drops,#ptc,#fl{transition:opacity .55s ease,visibility .55s ease}\n#info{transition:background-color .4s ease}\n#ttl{transition:opacity .35s ease}\n@media (prefers-reduced-motion:reduce){.el,.al,.be,.ald,.fx,.tk,#adh-water-drops,#ptc,#fl,.sb{transition-duration:.08s}}\n.liddle-out{display:none;opacity:0;transform:translateY(-7px);transition:opacity .5s,transform .5s;background:#f5e8d7;border:2px solid #b87537;border-radius:12px;padding:13px 16px;margin:10px 0;color:#49311b}.liddle-out.show{display:block;opacity:1;transform:translateY(0)}.out-title{font-size:17px;font-weight:bold;margin-bottom:10px}.out-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:8px}.out-grid>div{background:#fff9f1;border-radius:8px;padding:10px}.out-grid b{display:block;font-size:15px}.out-grid small{display:block;margin-top:5px;line-height:1.4}.out-foot{margin-top:10px;font-size:13px}#liddleArrows{pointer-events:none}#liddleArrows .pulse{animation:lidPulse 1.8s ease-in-out infinite}@keyframes lidPulse{0%,100%{opacity:.45}50%{opacity:1}}@media(prefers-reduced-motion:reduce){#liddleArrows .pulse{animation:none}}\n .di-out{display:none;opacity:0;transform:translateY(-7px);transition:opacity .5s,transform .5s;background:#e4f0fc;border:2px solid #4b83ba;border-radius:12px;padding:13px 16px;margin:10px 0;color:#173d63}.di-out.show{display:block;opacity:1;transform:translateY(0)}.di-out .out-grid>div{background:#f7fbff}\n<\/style><\/head><body>\n<div id=\"wrap\"><div id=\"bar\"><span>Solutes:<\/span><\/div>\n<svg id=\"fig\" viewBox=\"0 0 1300 840\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Verdana,'DejaVu Sans',sans-serif\">\n<defs id=\"defs\">\n<clipPath id=\"pc\"><rect x=\"30\" y=\"60\" width=\"1240\" height=\"770\" rx=\"18\"/><\/clipPath>\n<pattern id=\"hp\" width=\"10\" height=\"10\" patternUnits=\"userSpaceOnUse\" patternTransform=\"rotate(45)\"><rect width=\"10\" height=\"10\" fill=\"#e0a58f\"/><rect width=\"5\" height=\"10\" fill=\"#b8553a\"/><\/pattern>\n<marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0L10,5L0,10Z\" fill=\"#111\"/><\/marker>\n<\/defs>\n<rect width=\"1300\" height=\"840\" fill=\"#c9d4c8\"/>\n<text x=\"650\" y=\"34\" font-size=\"24\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#111\">LATE DCT AND COLLECTING DUCT<\/text>\n<g clip-path=\"url(#pc)\"><rect x=\"30\" y=\"60\" width=\"260\" height=\"770\" fill=\"#d4d4d4\"/><\/g>\n<path d=\"M1115,172 L1115,810 A70,24 0 0 0 1255,810 L1255,172 Z\" fill=\"#ffcccc\"/><ellipse cx=\"1185\" cy=\"172\" rx=\"70\" ry=\"24\" fill=\"#ffe3e3\"/>\n<rect x=\"290\" y=\"112\" width=\"590\" height=\"318\" rx=\"40\" fill=\"#cfdae8\" stroke=\"#7d9bc4\" stroke-width=\"7\"/>\n<rect x=\"290\" y=\"452\" width=\"590\" height=\"368\" rx=\"40\" fill=\"#cfdae8\" stroke=\"#7d9bc4\" stroke-width=\"7\"/>\n<rect x=\"405\" y=\"428\" width=\"46\" height=\"35\" fill=\"url(#hp)\" stroke=\"#8a4a38\" stroke-width=\"2\"/>\n<path d=\"M170 140 L210 140 L210 205 L235 205 L190 255 L145 205 L170 205Z\" fill=\"#f6e4a8\"/>\n<path d=\"M170 485 L210 485 L210 550 L235 550 L190 600 L145 550 L170 550Z\" fill=\"#f6e4a8\"/>\n<text id=\"ttl\" x=\"585\" y=\"100\" font-size=\"20\" text-anchor=\"middle\" fill=\"#111\">\u03b1-Intercalated cell<\/text>\n<text x=\"585\" y=\"447\" font-size=\"20\" text-anchor=\"middle\" fill=\"#111\">Principal cell<\/text>\n<text x=\"48\" y=\"92\" font-size=\"20\" font-weight=\"bold\" fill=\"#111\">Lumen<\/text><text x=\"1252\" y=\"92\" font-size=\"20\" font-weight=\"bold\" text-anchor=\"end\" fill=\"#111\">Blood<\/text>\n<text x=\"48\" y=\"432\" font-size=\"20\" font-weight=\"bold\" fill=\"#111\">Lumen<\/text><text x=\"1252\" y=\"432\" font-size=\"20\" font-weight=\"bold\" text-anchor=\"end\" fill=\"#111\">Blood<\/text>\n<g fill=\"#fff\" stroke=\"#8a8a8a\" stroke-width=\"2\"><rect x=\"48\" y=\"104\" width=\"86\" height=\"32\" rx=\"3\"/><rect x=\"1168\" y=\"104\" width=\"84\" height=\"32\" rx=\"3\"/><rect x=\"48\" y=\"444\" width=\"86\" height=\"32\" rx=\"3\"/><rect x=\"1168\" y=\"444\" width=\"84\" height=\"32\" rx=\"3\"/><\/g>\n<g font-size=\"19\" fill=\"#111\" text-anchor=\"middle\" dominant-baseline=\"central\"><text class=\"mv\" x=\"91\" y=\"121\"><\/text><text class=\"mv\" x=\"91\" y=\"461\"><\/text><text x=\"1210\" y=\"121\">0 mV<\/text><text x=\"1210\" y=\"461\">0 mV<\/text><\/g>\n<g id=\"dyn\"><\/g><g id=\"ptc\"><\/g><text id=\"fl\" x=\"160\" y=\"121\" font-size=\"15\" fill=\"#33404c\" dominant-baseline=\"central\">Fluid flow \u2193<\/text><g id=\"fx\"><\/g><\/svg>\n<div id=\"liddleOut\" class=\"liddle-out\" aria-live=\"polite\"><div class=\"out-title\">Liddle syndrome \u2014 consequences of constitutively active ENaC<\/div><div class=\"out-grid\"><div><b>\u2191 Na\u207a reabsorption<\/b><small>Na\u207a and water retention \u2192 extracellular volume expansion<\/small><\/div><div><b>\u2191 Blood pressure<\/b><small>Volume-dependent hypertension<\/small><\/div><div><b>\u2191 K\u207a secretion<\/b><small>Hypokalaemia<\/small><\/div><div><b>\u2191 H\u207a secretion<\/b><small>Metabolic alkalosis<\/small><\/div><div><b>\u2193 Renin \u00b7 \u2193 Aldosterone<\/b><small>Suppressed by volume expansion<\/small><\/div><\/div><div class=\"out-foot\">ENaC is overactive independently of aldosterone. Amiloride or triamterene inhibits ENaC; spironolactone is generally ineffective.<\/div><\/div><div id=\"diOut\" class=\"di-out\" aria-live=\"polite\"><div class=\"out-title\">Diabetes insipidus \u2014 reduced collecting duct water permeability<\/div><div class=\"out-grid\"><div><b>\u2193 Functional AQP2 at apical membrane<\/b><small>Water cannot enter the principal cell effectively<\/small><\/div><div><b>\u2193 Water reabsorption<\/b><small>Water remains in the tubular lumen<\/small><\/div><div><b>\u2191 Dilute urine<\/b><small>Polyuria and low urine osmolality<\/small><\/div><div><b>\u2191 Thirst<\/b><small>Risk of dehydration and hypernatraemia if water intake is inadequate<\/small><\/div><\/div><div class=\"out-foot\"><b>Central DI:<\/b> insufficient ADH secretion; responds to desmopressin. <b>Nephrogenic DI:<\/b> impaired renal response to ADH; desmopressin has little or no effect. This diagram illustrates their shared final water-transport defect.<\/div><\/div><div id=\"bar2\" style=\"margin:10px 0 0\"><span>Hormones and drugs:<\/span><\/div>\n<div id=\"info\"><\/div><\/div>\n<script>\nconst $=s=>document.querySelector(s);\nconst TK={Na:['Na\u207a','#8d8a1b'],K:['K\u207a','#d62d20'],H:['H\u207a','#2b4fd6'],B:['HCO\u2083\u207b','#b8505e'],H2O:['H\u2082O','#2b8fd6'],Cl:['Cl\u207b','#2e7d4f']};\nconst SH={Na:'Na\u207a',K:'K\u207a',H:'H\u207a',B:'HCO\u2083\u207b',H2O:'H\u2082O',Cl:'Cl\u207b'};\nconst INFO={Na:'<b>Na\u207a<\/b> enters the principal cell through ENaC channels, down a steep gradient, and the Na\u207a\u2013K\u207a ATPase pumps it out to the blood. Na\u207a entry makes the lumen negative (\u221250 mV), which in turn pulls K\u207a and H\u207a into the lumen.',\nK:'<b>K\u207a<\/b> has two routes. In the principal cell the Na\u207a\u2013K\u207a ATPase brings K\u207a in and it leaves through a K\u207a channel into the lumen, down its gradient (secretion). In the \u03b1-intercalated cell the H\u207a/K\u207a-ATPase takes K\u207a from the lumen and it exits to the blood (reabsorption).',\nH:'<b>H\u207a<\/b> is secreted into the lumen by the \u03b1-intercalated cell, by an H\u207a-ATPase and by the H\u207a/K\u207a-ATPase. Carbonic anhydrase (CA) makes the H\u207a from CO\u2082 + H\u2082O. This is how the collecting duct acidifies the urine.',\nB:'<b>HCO\u2083\u207b<\/b> is made together with H\u207a by carbonic anhydrase in the \u03b1-intercalated cell and leaves across the blood-side membrane (dashed arrow; the exchanger is not labeled in the figure). Each H\u207a secreted adds a new HCO\u2083\u207b to the blood.',\nH2O:'<b>Water<\/b> is reabsorbed in the principal cell only when ADH is present. ADH inserts AQP2 into the lumen membrane, and water leaves to the blood through AQP3 and AQP4. Turn on ADH to see it.',\nALD:'<b>Aldosterone \u2191<\/b> increases the activity of the Na\u207a\u2013K\u207a ATPase, ENaC, the H\u207a-ATPase and the K\u207a channel. More NaCl is reabsorbed, and more K\u207a and H\u207a are secreted. In the figure, the extra ENaC channels and Na\u207a\u2013K\u207a ATPase pumps (red outlines) show the increase.',\nADH:'<b>ADH<\/b> puts AQP2 channels into the lumen membrane of the principal cell. Water then follows the osmotic gradient through AQP2 and AQP3/4 into the blood, concentrating the urine.',\nKSD:'<b>K\u207a-sparing diuretics<\/b> block Na\u207a entry through ENaC (amiloride, triamterene) or block the aldosterone receptor (spironolactone, eplerenone). Less Na\u207a enters, the lumen becomes less negative, and less K\u207a and H\u207a are secreted, so K\u207a can rise (hyperkalemia).'};\nINFO.Cl='<b>Cl\u207b<\/b> is not moved by the transporters of the \u03b1-intercalated cell or the principal cell shown here. Switch to the \u03b2-intercalated cell to see Cl\u207b/HCO\u2083\u207b exchange by pendrin.';\nINFO.AB='<b>\u03b1-intercalated cell<\/b>: secretes H\u207a into the lumen (H\u207a-ATPase and H\u207a/K\u207a-ATPase) and returns HCO\u2083\u207b to the blood. It acidifies the urine and reabsorbs K\u207a.';\nconst INFOB={AB:'<b>\u03b2-intercalated cell<\/b>: the transporters are reversed. Pendrin (a Cl\u207b/HCO\u2083\u207b exchanger) sits on the lumen side and secretes HCO\u2083\u207b, while an H\u207a-ATPase sits on the blood side and pumps H\u207a into the blood. It makes the urine more alkaline, and it has no H\u207a/K\u207a-ATPase.',H:'<b>H\u207a<\/b> in the \u03b2-intercalated cell is pumped out across the blood-side membrane by an H\u207a-ATPase, the opposite side from the \u03b1 cell, so the urine is not acidified.',B:'<b>HCO\u2083\u207b<\/b> is secreted into the lumen by pendrin, a Cl\u207b/HCO\u2083\u207b exchanger on the lumen membrane. The HCO\u2083\u207b comes from carbonic anhydrase (CA), which makes H\u207a and HCO\u2083\u207b from CO\u2082 and water. This removes HCO\u2083\u207b from the body, which helps in metabolic alkalosis.',Cl:'<b>Cl\u207b<\/b> enters the \u03b2-intercalated cell from the lumen in exchange for HCO\u2083\u207b through pendrin and leaves across the blood side through a Cl\u207b channel.',K:'<b>K\u207a<\/b> reabsorption by the H\u207a/K\u207a-ATPase belongs to the \u03b1-intercalated cell, so it does not happen here. The principal cell still secretes K\u207a.'};\nconst DEF='Select solutes to follow their routes; others fade. Turn on Moving solutes to watch Na\u207a (olive), K\u207a (red) and water (blue) drift down the lumen and cross the cells, and H\u207a and HCO\u2083\u207b appear from the \u03b1-intercalated cell. Try aldosterone, ADH and K\u207a-sparing diuretics.';\nconst SP=[['s0','#f4d8db','#d58f98'],['s1','#e2f2f4','#5fb0bd'],['s2','#dcd6ef','#8f84bb'],['s3','#e4f3de','#8fc486'],['s4','#f7e3c6','#d9a468']];\n$('#defs').insertAdjacentHTML('beforeend',SP.map(([i,a,b])=>`<radialGradient id=\"${i}\" cx=\".35\" cy=\".3\" r=\".85\"><stop offset=\"0\" stop-color=\"#fff\"/><stop offset=\".3\" stop-color=\"${a}\"/><stop offset=\"1\" stop-color=\"${b}\"/><\/radialGradient>`).join(''));\nconst arrow=(x1,y,x2)=>`<line x1=\"${x1}\" y1=\"${y}\" x2=\"${x2}\" y2=\"${y}\" stroke=\"#111\" stroke-width=\"2.4\" marker-end=\"url(#ah)\"/>`;\nconst txt=(t,x,y,s=20)=>`<text x=\"${x}\" y=\"${y}\" font-size=\"${s}\" fill=\"#111\" dominant-baseline=\"central\">${t}<\/text>`;\nconst ctr=(t,x,y,s=18)=>`<text x=\"${x}\" y=\"${y}\" font-size=\"${s}\" fill=\"#111\" text-anchor=\"middle\" dominant-baseline=\"central\">${t}<\/text>`;\nconst el=(k,i)=>`<g class=\"el\" data-k=\"${k}\">${i}<\/g>`;\nconst lab=(t,c,s)=>`<text y=\"1\" font-size=\"${s}\" font-weight=\"bold\" fill=\"${c}\" text-anchor=\"middle\" dominant-baseline=\"central\" pointer-events=\"none\">${t}<\/text>`;\nconst tp=(k,x,y,f,n,l,c='#1d2a1d',s=15)=>`<g class=\"el tp\" data-k=\"${k}\" data-x=\"${x}\" data-y=\"${y}\" transform=\"translate(${x},${y})\"><title>${n}<\/title><circle r=\"34\" fill=\"url(#${f})\" stroke=\"#555\" strok
