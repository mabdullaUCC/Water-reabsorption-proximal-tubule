<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Nephron: Interactive Cells</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:#c9d4c8;font-family:Verdana,"DejaVu Sans",sans-serif;color:#1d2a1d}
#wrap{max-width:1500px;margin:0 auto;padding:12px}
h1{font-size:22px;margin:6px 0 4px;text-align:center}.sub{text-align:center;font-size:13px;color:#485a49;margin:0 0 10px}
.tabs{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:0 0 10px}
.tb{--c:#555;border:2px solid #1d2a1d;background:var(--c);color:#1d2a1d;border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.tb:hover,.tb.on{box-shadow:0 0 0 3px #fff8}
#stage{position:relative;container-type:inline-size;border-radius:12px;overflow:hidden;background:#fff}
#stage>img{display:block;width:100%;height:auto}
.hs{position:absolute;border:3px solid var(--c);border-radius:14px;background:rgba(255,255,255,.1);cursor:pointer;animation:pl 2.2s ease-in-out infinite;transition:background .2s}
.hs:hover{background:rgba(255,255,255,.45);animation:none;box-shadow:0 0 0 4px var(--c),0 6px 18px #0005}
.hs span{position:absolute;left:-3px;top:0;transform:translateY(-55%);background:var(--c);color:#1d2a1d;border:2px solid #1d2a1d;border-radius:999px;padding:.15em .7em;font-size:max(10px,1.2cqw);font-weight:bold;white-space:nowrap}
.pin{border-radius:50%}.pin span{left:auto;right:0;top:50%;transform:translate(0,-50%) translateX(-140%)}
@keyframes pl{0%,100%{box-shadow:0 0 0 0 #fff0}50%{box-shadow:0 0 0 6px #fff9}}
#md{position:fixed;inset:0;background:rgba(20,30,20,.6);display:none;z-index:50;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#md.open{display:flex;align-items:center;justify-content:center}
#pn{width:min(1280px,96vw);height:92vh;background:#c9d4c8;border-radius:14px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 40px #0008}
#ph{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#bcc7b8;flex-wrap:wrap}
#ph b{font-size:15px;flex:1;min-width:160px}
#ph .tb{padding:4px 10px}
#fr{flex:1;border:0;width:100%;background:#c9d4c8}
.x{background:#c0281f;color:#fff}
</style></head><body>

te;padding:7px 22px;border-width:2px;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 38%,#fff) 0 50%,#fff 50% 100%);box-shadow:inset 0 6px 6px -4px rgba(255,255,255,.95),inset 0 -6px 6px -4px rgba(0,0,0,.18)}\n#bar2 .sb::after{content:\"\";position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--c);opacity:.5;z-index:-1}\n#bar2 .sb.on{background:linear-gradient(90deg,var(--c) 0 50%,color-mix(in srgb,var(--c) 70%,#000) 50% 100%);color:#fff}\n#bar2 .sb.on::after{background:#fff;opacity:.55}\n#bar2 .sb[data-k=\"FAN\"]{padding:6px 14px;background:rgba(255,255,255,.35);box-shadow:none}\n#bar2 .sb[data-k=\"FAN\"]::after{display:none}\n#bar2 .sb[data-k=\"FAN\"].on{background:var(--c);color:#fff}\n<\/style><\/head><body>\n<div id=\"wrap\"><div id=\"bar\"><span>Solutes:<\/span><\/div>\n<svg id=\"fig\" viewBox=\"0 0 1300 800\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Verdana,'DejaVu Sans',sans-serif\">\n<defs>\n<linearGradient id=\"gg\" x1=\"0\" x2=\"1\"><stop offset=\"0\" stop-color=\"#d0d0d0\"/><stop offset=\"1\" stop-color=\"#b8b8b8\"/><\/linearGradient>\n<linearGradient id=\"cg\" x1=\"0\" x2=\"1\"><stop offset=\"0\" stop-color=\"#b5b5b5\"/><stop offset=\".8\" stop-color=\"#f4f4f4\"/><stop offset=\"1\" stop-color=\"#fff\"/><\/linearGradient>\n<clipPath id=\"pc\"><rect x=\"30\" y=\"60\" width=\"1240\" height=\"730\" rx=\"18\"/><\/clipPath>\n<marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0L10,5L0,10Z\" fill=\"#111\"/><\/marker>\n<\/defs>\n<rect width=\"1300\" height=\"800\" fill=\"#c9d4c8\"/>\n<text x=\"650\" y=\"34\" font-size=\"24\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#111\">EARLY PROXIMAL TUBULE<\/text>\n<g clip-path=\"url(#pc)\"><rect x=\"30\" y=\"60\" width=\"260\" height=\"730\" fill=\"url(#gg)\"/><\/g>\n<path d=\"M1115,172 L1115,770 A70,24 0 0 0 1255,770 L1255,172 Z\" fill=\"#ffcccc\"/>\n<ellipse cx=\"1185\" cy=\"172\" rx=\"70\" ry=\"24\" fill=\"#ffe3e3\"/>\n<rect x=\"290\" y=\"125\" width=\"590\" height=\"640\" rx=\"40\" fill=\"#cfdae8\" stroke=\"#7d9bc4\" stroke-width=\"7\"/>\n<text x=\"585\" y=\"100\" font-size=\"20\" text-anchor=\"middle\" fill=\"#111\">Cell of the early proximal tubule<\/text>\n<g font-size=\"20\" fill=\"#111\"><text x=\"48\" y=\"92\" font-weight=\"bold\">Lumen<\/text><text x=\"1252\" y=\"92\" font-weight=\"bold\" text-anchor=\"end\">Blood<\/text><\/g>\n<g fill=\"#fff\" stroke=\"#8a8a8a\" stroke-width=\"2\"><rect x=\"48\" y=\"104\" width=\"86\" height=\"32\" rx=\"3\"/><rect x=\"1168\" y=\"104\" width=\"84\" height=\"32\" rx=\"3\"/><\/g>\n<g font-size=\"19\" fill=\"#111\" text-anchor=\"middle\" dominant-baseline=\"central\"><text x=\"91\" y=\"121\">\u22124 mV<\/text><text x=\"1210\" y=\"121\">0 mV<\/text><\/g>\n<g id=\"dyn\"><\/g><g id=\"waterDots\" pointer-events=\"none\"><\/g><g id=\"sgltBlock\" style=\"opacity:0;transition:opacity .35s ease;pointer-events:none\"><line x1=\"269\" y1=\"309\" x2=\"311\" y2=\"351\" stroke=\"#c0281f\" stroke-width=\"6\"/><line x1=\"311\" y1=\"309\" x2=\"269\" y2=\"351\" stroke=\"#c0281f\" stroke-width=\"6\"/><text x=\"335\" y=\"295\" font-size=\"16\" font-weight=\"bold\" fill=\"#c0281f\">SGLT2 inhibited<\/text><text x=\"48\" y=\"275\" font-size=\"15\" font-weight=\"bold\" fill=\"#c0281f\">Glucose remains in lumen \u2193<\/text><\/g><g id=\"ptc\"><\/g><text id=\"fl\" x=\"160\" y=\"121\" font-size=\"15\" fill=\"#33404c\" dominant-baseline=\"central\">Fluid flow \u2193<\/text><g id=\"fx\"><\/g><\/svg>\n<div id=\"bar2\" style=\"margin:10px 0 0\"><span>Drugs and disease:<\/span><\/div>\n<div id=\"info\"><\/div><section id=\"reabs\" aria-label=\"Proximal tubule reabsorption percentages\"><h2>Proximal tubule \u2014 approximate reabsorption<\/h2><p class=\"sub\">Percentage of the filtered load reabsorbed along the <strong>entire proximal tubule<\/strong> (early + late segments), under normal conditions.<\/p><div class=\"pctgrid\">\n<div><div class=\"pctrow\"><span>Glucose<\/span><span>~100%<\/span><\/div><div class=\"track\"><div class=\"fill\" style=\"--c:#2a8fa0;width:100%\"><\/div><\/div><\/div>\n<div><div class=\"pctrow\"><span>Amino acids<\/span><span>~100%<\/span><\/div><div class=\"track\"><div class=\"fill\" style=\"--c:#c2751f;width:100%\"><\/div><\/div><\/div>\n<div><div class=\"pctrow\"><span>Na\u207a<\/span><span>~65\u201370%<\/span><\/div><div class=\"track\"><div class=\"fill\" style=\"--c:#8d8a1b;width:67%\"><\/div><\/div><\/div>\n<div><div class=\"pctrow\"><span>Water<\/span><span>~65\u201370%<\/span><\/div><div class=\"track\"><div class=\"fill\" style=\"--c:#277dba;width:67%\"><\/div><\/div><\/div>\n<div><div class=\"pctrow\"><span>K\u207a<\/span><span>~65%<\/span><\/div><div class=\"track\"><div class=\"fill\" style=\"--c:#d62d20;width:65%\"><\/div><\/div><\/div>\n<div><div class=\"pctrow\"><span>HCO\u2083\u207b<\/span><span>~80\u201390%<\/span><\/div><div class=\"track\"><div class=\"fill\" style=\"--c:#b8505e;width:85%\"><\/div><\/div><\/div>\n<div><div class=\"pctrow\"><span>Phosphate<\/span><span>~70\u201380%<\/span><\/div><div class=\"track\"><div class=\"fill\" style=\"--c:#6a5aa8;width:75%\"><\/div><\/div><\/div>\n<div><div class=\"pctrow\"><span>Lactate / citrate<\/span><span>Most (>90%)*<\/span><\/div><div class=\"track\"><div class=\"fill\" style=\"--c:#7763a6;width:93%\"><\/div><\/div><\/div>\n<\/div><p class=\"foot\">*Lactate and citrate handling varies with plasma concentration and acid\u2013base status. Organic anions and cations are predominantly <strong>secreted<\/strong> here rather than assigned a single reabsorption percentage. These are teaching approximations, not measurements for this individual early-proximal-tubule cell; drug and disease buttons do not recalculate the reference percentages.<\/p><\/section><\/div>\n<script>\nconst $=s=>document.querySelector(s);\nconst TK={Na:['Na\u207a','#8d8a1b'],K:['K\u207a','#d62d20'],Glu:['Glucose','#2a8fa0'],AA:['Amino acid','#c2751f'],PLC:['Phosphate, lactate, citrate','#6a5aa8'],H:['H\u207a','#2b4fd6'],B:['HCO\u2083\u207b','#b8505e'],OAC:['Organic anions and cations','#4f7d3a']};\nconst SH={Na:'Na\u207a',K:'K\u207a',Glu:'Glc',AA:'AA',PLC:'P/L/C',H:'H\u207a',B:'HCO\u2083\u207b',OAC:'OA\u207b/OC\u207a'};\nconst INFO={Na:'<b>Na\u207a<\/b> enters the cell from the lumen by four routes: cotransport with glucose, with amino acids, with phosphate, lactate or citrate, and in exchange for H\u207a. The Na\u207a\u2013K\u207a ATPase on the blood side pumps it back out using ATP, which keeps intracellular Na\u207a low and powers all of this coupled transport.',\nK:'<b>K\u207a<\/b> is taken up from the blood side by the Na\u207a\u2013K\u207a ATPase, which moves 3 Na\u207a out for every 2 K\u207a in (primary active transport).',\nGlu:'<b>Glucose<\/b> enters with Na\u207a via SGLT2 (low affinity, high capacity) on a cotransporter (secondary active transport, energy from the Na\u207a gradient) and leaves toward the blood down its gradient by facilitated diffusion.',\nAA:'<b>Amino acids<\/b> follow the same pattern as glucose: Na\u207a-coupled cotransport into the cell, then carrier-mediated exit across the blood-side membrane.',\nPLC:'<b>Phosphate, lactate and citrate<\/b> enter on Na\u207a-coupled cotransporters at the lumen side and leave across the blood-side membrane by carriers.',\nH:'<b>H\u207a<\/b> is secreted into the lumen by the Na\u207a/H\u207a exchanger: Na\u207a moves in down its gradient and H\u207a moves out (secondary active transport). The H\u207a comes from the cell: carbonic anhydrase (CA) converts CO\u2082 + H\u2082O to H\u2082CO\u2083, which dissociates into H\u207a and HCO\u2083\u207b.',\nB:'<b>HCO\u2083\u207b<\/b> leaves the cell across the blood-side membrane into the blood. Inside the cell, carbonic anhydrase (CA) converts CO\u2082 + H\u2082O to H\u2082CO\u2083, which dissociates into HCO\u2083\u207b and the H\u207a that is secreted into the lumen.'};\nINFO.OAC='<b>Organic anions and cations<\/b> are secreted from the blood into the tubular fluid, crossing the cell from the blood side to the lumen through their own transporters (shown as one simplified arrow). <b>PAH<\/b> (para-aminohippurate) is an organic anion taken up by OAT1/OAT3 and almost completely cleared in one pass through the kidney, so PAH clearance estimates renal plasma flow. <b>Creatinine<\/b> is mainly filtered, but a small fraction (roughly 10\u201320%) is also secreted by organic cation transporters (OCT2, MATE1), so creatinine clearance slightly overestimates GFR.';\nINFO.SGLTI='<b>SGLT2 inhibitors<\/b> (e.g., empagliflozin or dapagliflozin) block apical SGLT2 in the early proximal tubule. This reduces Na\u207a-coupled glucose uptake, leaving more glucose in the lumen and causing glucosuria and osmotic diuresis. The drug does not directly block basolateral GLUT. SGLT1 further downstream can still reabsorb some glucose.';\nINFO.DX='<b>Diamox (acetazolamide)<\/b> inhibits carbonic anhydrase (CA), on the luminal brush border and inside the proximal tubule cell. Less H\u207a is generated, so Na\u207a/H\u207a exchange and HCO\u2083\u207b reabsorption fall. Bicarbonate, Na\u207a and water are lost in the urine (alkaline urine, mild diuresis), and a hyperchloremic (normal anion gap) metabolic acidosis develops.';\nINFO.MAN='<b>Mannitol<\/b> is freely filtered but not reabsorbed, so it stays in the tubular fluid and holds water in the lumen by osmosis. Water reabsorption falls, luminal Na\u207a becomes diluted, and less Na\u207a is reabsorbed, producing an osmotic diuresis. It acts in the proximal tubule and the loop of Henle.';\nINFO.FAN='<b>Fanconi syndrome<\/b> is a generalized failure of proximal tubule reabsorption. Often the Na\u207a gradient or the cell\\'s energy supply is impaired, so Na\u207a-coupled transport falls across the board. Glucose (with normal blood glucose), amino acids, phosphate and bicarbonate are lost in the urine, giving glucosuria, aminoaciduria, phosphaturia and proximal (type 2) renal tubular acidosis. Causes include cystinosis, Wilson disease, Dent disease, multiple myeloma light chains, and drugs such as tenofovir or ifosfamide.';\nINFO.B+=' In the lumen, filtered HCO\u2083\u207b is not taken up directly: it combines with secreted H\u207a to form CO\u2082 (the small grey dot), which diffuses into the cell and is rebuilt into HCO\u2083\u207b by carbonic anhydrase.';\nconst DEF='Blue water circles show osmotic water reabsorption from the lumen towards blood; the Moving water button toggles them. Turn on Moving solutes to show coloured dots in the tubular fluid (the filtered solutes). Watch them drift down the lumen, get taken up by their transporters, cross the cell and enter the blood (the colour matches the buttons above). Select solutes to follow their routes; others fade. Try the drugs and Fanconi syndrome to see reabsorption fail.';\nconst SP=[['s0','#e2f2f4','#5fb0bd'],['s1','#f7e3c6','#d9a468'],['s2','#dcd6ef','#8f84bb'],['s3','#f4d8db','#d58f98'],['s4','#e4f3de','#8fc486']];\n$('defs').insertAdjacentHTML('beforeend',SP.map(([i,a,b])=>`<radialGradient id=\"${i}\" cx=\".35\" cy=\".3\" r=\".85\"><stop offset=\"0\" stop-color=\"#fff\"/><stop offset=\".3\" stop-color=\"${a}\"/><stop offset=\"1\" stop-color=\"${b}\"/><\/radialGradient>`).join(''));\nconst R=[{y:330,s:'s0',a:'Glu',t:['Glucose'],o:'Glu',L:'Na\u207a\u2013glucose cotransporter',Rn:'Glucose carrier (facilitated diffusion)'},\n{y:450,s:'s1',a:'AA',t:['Amino acid'],o:'AA',L:'Na\u207a\u2013amino acid cotransporter',Rn:'Amino acid carrier'},\n{y:570,s:'s2',a:'PLC',t:['Phosphate, lactate,','or citrate'],o:'PLC',L:'Na\u207a\u2013phosphate/lactate/citrate cotransporter',Rn:'Phosphate/lactate/citrate carrier'},\n{y:690,s:'s3',a:'H',t:['H\u207a'],o:'B',t2:['HCO\u2083\u207b'],L:'Na\u207a/H\u207a exchanger',Rn:'HCO\u2083\u207b exit pathway'}];\nconst arrow=(x1,y,x2)=>`<line x1=\"${x1}\" y1=\"${y}\" x2=\"${x2}\" y2=\"${y}\" stroke=\"#111\" stroke-width=\"2.4\" marker-end=\"url(#ah)\"/>`;\nconst txt=(t,x,y)=>`<text x=\"${x}\" y=\"${y}\" font-size=\"20\" fill=\"#111\" dominant-baseline=\"central\">${t}<\/text>`;\nconst el=(k,inner)=>`<g class=\"el\" data-k=\"${k}\">${inner}<\/g>`;\nconst tp=(k,x,y,fill,name,extra='')=>`<g class=\"el tp\" data-k=\"${k}\" data-x=\"${x}\" data-y=\"${y}\" transform=\"translate(${x},${y})\"><title>${name}<\/title><circle r=\"34\" fill=\"url(#${fill})\" stroke=\"#555\" stroke-opacity=\".5\" stroke-width=\"2\"/>${extra}<\/g>`;\nlet h='';\nR.forEach(r=>{\nh+=el('Na '+r.a,arrow(225,r.y-26,355)+txt('Na\u207a',366,r.y-26));\nh+=el(r.a,(r.a=='H'?arrow(355,r.y+26,225):arrow(225,r.y+26,355))+r.t.map((s,i)=>txt(s,366,r.y+26+i*22)).join(''));\nh+=el(r.o,arrow(815,r.y-26,945)+(r.t2||r.t).map((s,i)=>txt(s,957,r.y-26+i*22)).join(''));\n});\nh+=el('Na',arrow(815,189,945)+txt('Na\u207a',957,189))+el('K',arrow(945,241,815)+txt('K\u207a',957,241));\nconst lab=t=>t?`<text y=\"1\" font-size=\"17\" font-weight=\"bold\" fill=\"#1d2a1d\" text-anchor=\"middle\" dominant-baseline=\"central\" pointer-events=\"none\">${t}<\/text>`:'';\nR.forEach(r=>{h+=tp('Na '+r.a,290,r.y,r.s,r.L,lab({Glu:'SGLT2',H:'NHE'}[r.a]))+tp(r.o,880,r.y,r.s,r.Rn,lab({Glu:'GLUT'}[r.o]))});\nh+=el('Glu', '<text x=\"330\" y=\"258\" font-size=\"16\" font-weight=\"bold\" fill=\"#236a75\">Low affinity \u00b7 High capacity<\/text>');\nh+=tp('Na K',880,215,'s4','Na\u207a\u2013K\u207a ATPase','<text y=\"1\" font-size=\"18\" font-weight=\"bold\" fill=\"#2a4a9a\" text-anchor=\"middle\" dominant-baseline=\"central\">ATP<\/text>');\n// flows\nconst FL=[];\nR.forEach(r=>{FL.push(['Na',150,r.y-26,430,r.a]);FL.push([r.a,r.a=='H'?430:150,r.y+26,r.a=='H'?150:430]);FL.push([r.o,780,r.y-26,1060])});\nFL.push(['Na',780,189,1060]);FL.push(['K',1060,241,780]);FL.push(['OAC',1185,776,130,0,'PAH','#4f7d3a',.17]);FL.push(['OAC',1185,776,130,0,'Creatinine','#8a5a2a',.33]);\nFL.forEach((f,i)=>{[0,.5].forEach(p=>{const l=f[5]||SH[f[0]],w=Math.max(42,l.length*10+18)
